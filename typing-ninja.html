<!doctype html>
<html lang="zh-Hant" data-kind="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打字忍者</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
:root{
  --paper:#E3EDF2; --grid:#D0DEE6; --ink:#1B2836; --ink-soft:#4C5D6E; --card:#fff; --wash:#F3F7FA;
  --case:#26323F; --cap:#F5F7F9; --cap-edge:#AEBBC7; --cap-dim:#D9E1E8; --dim-txt:#8593A1;
  --good:#1FA963; --bad:#E5484D; --hl:#FFE066; --gold:#F2B400; --mid:#B07D00;
  --c-mid:#3A9FEF; --c-top:#EE4F8B; --c-bot:#9466EE; --c-cus:#1FA963; --c-ninja:#3B2F5C;
  --f-display:'LXGW WenKai TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --f-key:'Fredoka','Noto Sans TC',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{background:var(--paper)}
body{margin:0;background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:16px/1.6 var(--f-body);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.wrap{height:100%;display:flex;flex-direction:column;gap:10px;max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
button,input{font-family:inherit}
.top{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1{font-size:28px;letter-spacing:.04em;user-select:none}
.tagk{display:inline-block;background:var(--hl);border:3px solid var(--ink);border-radius:10px;padding:0 8px;box-shadow:3px 3px 0 var(--ink);font:600 18px var(--f-key);transform:rotate(-4deg)}
.badge{display:inline-block;font-size:13px;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:0 10px;background:var(--wash)}
.ver{background:var(--hl);font-size:14px}
.ver.demo{background:#FF6B4A;color:#fff}
.top:has(#hud:not([hidden])) .ver,.top:has(#hud:not([hidden])) .tagk{display:none}
.top:has(#hud:not([hidden])) .brand h1{font-size:22px}
.top:has(#hud:not([hidden])) .hud-item{padding:0 10px}
.who{font-weight:900;font-size:15px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 12px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.footnav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding-top:10px;border-top:3px dashed var(--cap-edge)}
.btn{font:700 16px var(--f-body);padding:8px 16px;border:3px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.btn:hover{background:var(--wash)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--hl)}
.btn.sm{font-size:14px;padding:4px 12px}
.btn:focus-visible,.diff:focus-visible,.setcard:focus-visible{outline:3px solid var(--c-mid);outline-offset:3px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:18px}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.hud-item{background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:1px 12px;display:flex;align-items:center;gap:8px;box-shadow:3px 3px 0 var(--ink)}
.hud-l{font-size:12px;color:var(--ink-soft)}
.hud-item b{font:600 20px var(--f-key);font-variant-numeric:tabular-nums}
.hud-item b.t{font:900 17px var(--f-body)}
.hearts{font-size:20px;letter-spacing:2px;color:var(--bad)}
.hearts .off{color:var(--cap-dim)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
main>[data-screen]{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
main>[data-screen=home],main>[data-screen=sets],main>[data-screen=result]{overflow:auto;padding:0 6px 6px 0}
.demo-bar{background:#FF6B4A;color:#fff;font-weight:900;border:3px solid var(--ink);border-radius:12px;padding:6px 14px}

/* 範圍選擇 */
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.setcard{display:grid;gap:6px;text-align:left;cursor:pointer;background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:0 0 14px;overflow:hidden;font:inherit;color:inherit}
.setcard:hover{background:#FFFBE6}
.setcard .band{height:14px;border-bottom:3px solid var(--ink)}
.setcard h2{font-size:26px;padding:0 16px}
.setcard .keys{padding:0 16px;font:600 22px var(--f-key);letter-spacing:.12em}
.setcard .st{padding:0 16px;font-size:13px;font-weight:900;color:var(--ink-soft)}
.intro{display:grid;gap:4px}
.intro h2{font-size:28px}
.intro p{color:var(--ink-soft);font-weight:700}

/* 首頁卡片 */
.entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;align-items:start}
.entry{display:flex;flex-direction:column;background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);overflow:hidden}
.entry-band{height:58px;border-bottom:3px solid var(--ink);position:relative;display:flex;align-items:flex-end;padding:10px 14px}
.entry-band .num{font:600 15px var(--f-key);background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 9px}
.entry-band .deco{position:absolute;right:14px;top:12px;display:flex;gap:6px}
.entry-band .deco span{font:600 15px var(--f-key);background:#fff;border:2px solid var(--ink);border-radius:7px;padding:1px 8px;box-shadow:0 3px 0 var(--ink)}
.entry-body{padding:14px;display:flex;flex-direction:column;gap:10px}
.entry-body h2{font-size:25px}
.entry.locked .entry-band,.entry.locked .entry-body h2{opacity:.45}
.lockmsg{font-size:14px;font-weight:900;background:var(--wash);border:2px dashed var(--ink-soft);border-radius:10px;padding:4px 10px}
.diffs{display:grid;gap:8px}
.diff{display:flex;justify-content:space-between;align-items:center;gap:10px;font:900 18px var(--f-body);border:3px solid var(--ink);border-radius:12px;background:var(--wash);padding:6px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);color:var(--ink);width:100%;text-align:left}
.diff:hover:not(:disabled){background:var(--hl)}
.diff:disabled{cursor:not-allowed;opacity:.6}
.diff small{display:block;font-size:13px;font-weight:700;color:var(--ink-soft);line-height:1.3}
.lv-r{display:grid;justify-items:end;line-height:1.25;flex:none}
.stars{color:var(--gold);letter-spacing:1px;font-size:16px;white-space:nowrap}
.stars .off{color:var(--cap-dim)}
.lv-best{font-size:12px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.dots{font-size:15px;letter-spacing:3px;color:var(--good)}
.dots .off{color:var(--cap-dim)}
.titlebar{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;border:2px dashed var(--gold);border-radius:12px;padding:6px 12px;background:#FFF9DB;font-size:14px;font-weight:900}
.titlebar b{color:var(--mid);font-size:17px}
.ladder{display:flex;gap:4px;flex-wrap:wrap}
.ladder span{border:2px solid var(--ink);border-radius:999px;padding:0 8px;font-size:12px;background:#fff;opacity:.4}
.ladder span.on{opacity:1;background:var(--hl)}
.tnote{font-size:13px;color:var(--ink-soft);font-weight:700}
.tpanel{display:grid;gap:10px}
.check{display:grid;gap:12px;width:min(760px,100%);margin:0 auto;justify-items:center;text-align:center}
.check h2{font-size:30px}
.chk-steps{margin:0;padding-left:1.4em;text-align:left;font-size:18px;font-weight:700;line-height:1.8}
.chk-list{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.chk-item{display:grid;justify-items:center;gap:2px;border:3px solid var(--ink);border-radius:14px;padding:6px 18px;background:var(--wash);min-width:170px}
.chk-item b{font:700 52px/1.1 'Microsoft JhengHei','Noto Sans TC',sans-serif}
.chk-item span{font-weight:900;font-size:15px}
.chk-item.now{background:#FFF9DB;border-color:var(--gold);box-shadow:0 4px 0 var(--gold)}
.chk-item.ok{background:#DDF5E7;border-color:var(--good)}
.chk-item.ok span::after{content:" ✓";color:var(--good)}
#chkIn{width:min(360px,100%)}
.check .thint{font-size:16px}
.tpanel label{font-weight:700;font-size:14px}
.tpanel input{font:700 15px var(--f-body);border:2px solid var(--ink);border-radius:8px;padding:2px 6px}

/* 道場（第一關、第二關） */
.stage{position:relative;flex:1;min-height:0;border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);overflow:hidden}
.dojo{position:absolute;inset:0;background:linear-gradient(#F6E7C8 0 62%,#C99A62 62% 100%);display:grid;place-items:center}
.dojo::before{content:"";position:absolute;left:0;right:0;top:62%;height:10px;background:#8A5A2B}
.dojo::after{content:"";position:absolute;inset:0 0 38%;background:repeating-linear-gradient(90deg,transparent 0 118px,rgba(138,90,43,.45) 118px 124px)}
.scroll{position:relative;z-index:2;background:#FFFDF4;border:4px solid var(--ink);border-radius:14px;box-shadow:0 8px 0 rgba(0,0,0,.2);padding:10px 40px 14px;text-align:center;min-width:min(520px,80%)}
.scroll .lbl{font-size:14px;font-weight:900;color:var(--ink-soft)}
.target{font:600 clamp(56px,13vh,120px)/1.1 var(--f-key);letter-spacing:.12em;text-transform:uppercase}
.target span{display:inline-block;border-radius:10px;padding:0 4px;transition:color .1s}
.target .ok{color:var(--good)}
.target .next{background:var(--hl);box-shadow:0 5px 0 var(--gold)}
.target .bad{background:#FFD6D8;color:var(--bad)}
.timer{position:relative;height:14px;flex:none;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--wash)}
.timer div{height:100%;width:100%;background:var(--good);transform-origin:left}
.timer div.warn{background:#FFC233}
.timer div.slow{background:#F28C38}
.how{font:900 18px var(--f-body);color:var(--ink-soft);min-height:0}
.how:empty,.clock:empty{display:none}
.clock{position:absolute;left:12px;top:10px;z-index:5;margin:0;font:700 14px/1.2 var(--f-body);font-variant-numeric:tabular-nums;color:var(--ink-soft);background:rgba(255,255,255,.7);border-radius:8px;padding:1px 8px}
.dojo{transition:background .5s}
.dojo[data-tier="2"]{background:linear-gradient(#CFE3FF 0 62%,#5B7FC7 62% 100%)}
.dojo[data-tier="2"] .scroll{background:#EEF5FF;border-color:#1D4ED8;box-shadow:0 8px 0 #1D4ED8}
.dojo[data-tier="3"]{background:linear-gradient(#FFD3EC 0 62%,#B0306F 62% 100%)}
.dojo[data-tier="3"] .scroll{background:#FFF0F8;border-color:#BE185D;box-shadow:0 8px 0 var(--gold)}
.tierbar{display:flex;justify-content:center;align-items:center;gap:6px 10px;flex-wrap:wrap;font-weight:900;font-size:15px}
.ts{font-size:22px;letter-spacing:2px;white-space:nowrap}
.ts .off{opacity:.22}
.ts.t1{color:#6B7B8C}.ts.t2{color:#1D4ED8}.ts.t3{color:#DB2777}
.hud-item .ts{font-size:17px}
.r-tier{display:flex;align-items:center;gap:8px;font-weight:900;border:3px solid var(--ink);border-radius:14px;padding:2px 14px;background:#FFF0F8}
.timer-zones{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink-soft);font-weight:700;padding:0 4px;margin-top:-6px;flex-wrap:wrap}
.fixfx{position:absolute;inset:0;pointer-events:none;z-index:7;display:grid;place-items:center}
.fixfx span{font:700 44px var(--f-display);color:var(--good);background:#fff;border:4px solid var(--good);border-radius:20px;padding:0 22px;animation:fix .8s ease-out forwards;text-align:center}
.fixfx.mid span{color:var(--mid);border-color:var(--gold)}
.fixfx.no span{color:var(--bad);border-color:var(--bad);font-size:32px}
@keyframes fix{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.1);opacity:1}100%{transform:scale(1) translateY(-20px);opacity:0}}
.go-cover{position:absolute;inset:0;background:rgba(27,40,54,.86);z-index:9;display:grid;place-items:center;align-content:center;gap:12px;color:#fff;text-align:center;padding:16px}
.go-cover h2{font-size:34px}
.go-cover p{font-size:18px;font-weight:700}
.count{font:600 72px/1 var(--f-key)}
.remind{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:8;background:#FFC233;border:3px solid var(--ink);border-radius:12px;padding:2px 14px;font-weight:900;white-space:nowrap}

/* 忍者場景 */
.scene{position:absolute;inset:0;transition:background .8s}
.scene .far{position:absolute;left:0;right:0;bottom:24%;height:46%;transition:background .8s;clip-path:polygon(0 100%,0 55%,10% 30%,22% 60%,34% 18%,48% 58%,60% 26%,74% 62%,86% 34%,100% 52%,100% 100%)}
.scene .near{position:absolute;left:0;right:0;bottom:24%;height:22%;transition:background .8s}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:24%;border-top:4px solid var(--ink);transition:background .8s}
.scene .ground::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(0,0,0,.08) 60px 64px);animation:run 1.2s linear infinite}
@keyframes run{to{background-position:-64px 0}}
.scene .moon{position:absolute;right:12%;top:10%;width:70px;height:70px;border-radius:50%;background:#FFF6CC;box-shadow:0 0 30px #FFF6CC;opacity:0;transition:opacity .8s}
.scene[data-th="3"] .moon,.scene[data-th="4"] .moon{opacity:1}
.scene[data-th="5"]{animation:storm 4s infinite}
@keyframes storm{0%,92%,100%{filter:none}94%{filter:brightness(2.2)}96%{filter:none}97%{filter:brightness(1.8)}}
.scene .rain{position:absolute;inset:0;opacity:0;background:repeating-linear-gradient(105deg,transparent 0 14px,rgba(255,255,255,.25) 14px 16px);animation:rain .5s linear infinite;pointer-events:none}
.scene[data-th="5"] .rain{opacity:1}
@keyframes rain{to{background-position:30px 60px}}
.player{position:absolute;left:6%;bottom:22%;width:clamp(80px,16vh,130px);z-index:3;transition:transform .12s}
.player.dash{transform:translateX(30px) scale(1.05)}
.player.hurt{animation:hurt .5s}
@keyframes hurt{25%,75%{transform:translateX(-10px);filter:brightness(1.8) saturate(0)}50%{transform:translateX(8px)}}
.enemy{position:absolute;bottom:22%;width:clamp(76px,15vh,124px);transform:translateX(-50%);z-index:4;display:grid;justify-items:center}
.enemy svg{width:100%;display:block;animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
.enemy.poof svg{animation:poof .35s forwards}
@keyframes poof{to{transform:scale(1.6) rotate(25deg);opacity:0}}
.word{font:600 clamp(26px,5.6vh,46px)/1.1 var(--f-key);background:#fff;border:3px solid var(--ink);border-radius:12px;padding:2px 12px;margin-bottom:6px;box-shadow:0 4px 0 rgba(0,0,0,.25);white-space:nowrap;letter-spacing:.06em;text-transform:uppercase}
.word span.ok{color:var(--good)}
.word span.cur{text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px;text-decoration-color:var(--gold)}
.word.err{animation:err .3s;border-color:var(--bad)}
@keyframes err{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.star{position:absolute;z-index:5;font-size:28px;pointer-events:none;transition:left .18s linear,bottom .18s linear;color:#2D3748;text-shadow:0 0 2px #fff}
.pts{position:absolute;z-index:6;font:600 26px var(--f-key);color:var(--mid);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:0 8px;animation:pts .9s forwards;pointer-events:none}
@keyframes pts{to{transform:translateY(-50px);opacity:0}}
.stagebig{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);z-index:8;font:700 clamp(28px,6vh,46px) var(--f-display);color:#fff;background:var(--ink);border:4px solid var(--hl);border-radius:20px;padding:4px 26px;white-space:nowrap;opacity:0;pointer-events:none}
.stagebig.go{animation:stagein 1.6s ease-out forwards}
@keyframes stagein{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
.flash{position:absolute;inset:0;z-index:6;pointer-events:none;animation:fl .45s}
@keyframes fl{from{background:rgba(229,72,77,.5)}to{background:transparent}}

/* 打字欄位（訓練學生自己切換英文輸入法） */
.typebox{flex:none;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px 12px;width:min(100%,760px);margin-inline:auto}
.tlabel{font-weight:900;font-size:15px;line-height:1.3}
.tlabel small{display:block;font-size:12px;color:var(--ink-soft);font-weight:700}
.tin{font:600 30px/1.2 var(--f-key);letter-spacing:.2em;text-transform:uppercase;text-align:center;border:4px solid var(--ink);border-radius:14px;padding:4px 12px;background:#FBFDFF;outline:none;box-shadow:0 4px 0 var(--ink);min-width:0}
.tin:focus{border-color:var(--c-mid);box-shadow:0 4px 0 var(--c-mid)}
.tin.bad{border-color:var(--bad);box-shadow:0 4px 0 var(--bad);background:#FFF1F1;color:var(--bad)}
/* 選字中：網頁自己在字下面畫橘色虛線（瀏覽器在輸入框裡不一定畫得出底線；老師 2026-10-30），外框不變色 */
.compline{position:fixed;height:0;border-bottom:3px dashed #F28C38;pointer-events:none;z-index:60}
.tin.ime{border-color:#F59E0B;box-shadow:0 4px 0 #F59E0B;background:#FFF7E0}
.thint{grid-column:1/-1;min-height:1.4em;font-size:14px;font-weight:900;text-align:center;color:var(--ink-soft)}
.thint.warn{color:#B45309}
.thint.bad{color:var(--bad)}
.word.dim{opacity:.55}
@media (max-height:700px){ .kb-case{display:none!important} }

/* 鍵盤（字母三排） */
.kb-case{flex:none;background:var(--case);border:3px solid var(--ink);border-radius:18px;padding:1.2%;box-shadow:5px 5px 0 var(--ink);width:min(100%,calc(clamp(110px,22vh,200px)*3.6));margin-inline:auto}
.kb{position:relative;width:100%;aspect-ratio:10.6/3;container-type:inline-size}
.k{--u:calc(100cqw / 10.6);position:absolute;width:calc(var(--u));height:33.33%;padding:calc(var(--u)*.05)}
.cap{width:100%;height:100%;border-radius:calc(var(--u)*.14);background:var(--cap-dim);color:var(--dim-txt);display:grid;place-items:center;font:600 calc(var(--u)*.4) var(--f-key);box-shadow:inset 0 calc(var(--u)*-.11) 0 var(--cap-edge);text-transform:uppercase;position:relative}
.k.in .cap{background:var(--cap);color:var(--ink)}
.k.home .cap::after{content:"";position:absolute;bottom:22%;left:38%;right:38%;height:calc(var(--u)*.05);background:var(--ink-soft);border-radius:2px}
.kb.blank .k .lbl{opacity:0}
.k.down .cap{background:var(--hl)!important;transform:translateY(calc(var(--u)*.06))}
.k.glow .cap{outline:calc(var(--u)*.1) solid var(--hl);animation:pulse 1s infinite;z-index:2}
@keyframes pulse{50%{outline-color:#fff}}
.k.ok .cap{background:var(--good)!important;color:#fff}
.k.no .cap{background:var(--bad)!important;color:#fff}
.k.show .cap{outline:calc(var(--u)*.12) solid #5BF08F;z-index:2}
.kb.blank .k.show .lbl{opacity:1}
.kb.punc{aspect-ratio:10.6/1.25}
.kb.punc .k{height:100%}
.kb.punc .cap{display:flex;flex-direction:column;justify-content:center;gap:2%;line-height:1;text-transform:none}
.kb.punc .cap .lbl{font-size:calc(var(--u)*.36)}
.kb.punc .cap .sub{font:700 calc(var(--u)*.3) var(--f-body);opacity:.85}
.kb.blank .k .sub{opacity:0}
html[data-kind=punc] .word,html[data-kind=punc] .target,html[data-kind=punc] .tin,html[data-kind=punc] .chipk,html[data-kind=punc] .setcard .keys,html[data-kind=punc] .entry-band .deco span{font-family:'Microsoft JhengHei','Noto Sans TC','PingFang TC',sans-serif;font-weight:700}
.kb.blank .k.show .sub{opacity:1}

/* 重要按鍵練習（data-kind=key）：舊版「電腦救援隊」的模擬電腦畫面（老師 2026-10-30：給情境，學生按按鍵） */
:root{--desk-a:#4F9BE0;--desk-b:#8CC6EE;--taskbar:#1F2A36;--doc-fs:clamp(18px,3.4vh,30px);--g-esc:#FF6B4A}
/* ---------- 模擬電腦 ---------- */
.monitor{background:var(--case);border:3px solid var(--ink);border-radius:18px;padding:8px;box-shadow:5px 5px 0 var(--ink);position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.desk{height:100%;border-radius:8px;background:linear-gradient(160deg,var(--desk-a),var(--desk-b));position:relative;overflow:hidden;display:flex;flex-direction:column}
.win{position:relative;margin:10px auto 8px;width:min(92%,720px);flex:1;min-height:0;background:#fff;border:2px solid var(--ink);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.win-bar{display:flex;justify-content:space-between;align-items:center;background:#E8EEF3;border-bottom:2px solid var(--ink);padding:2px 10px;font-size:14px;font-weight:700}
.win-bar .ctl{font-family:var(--f-key);letter-spacing:8px;color:var(--ink-soft)}
.win-body{flex:1;min-height:0;padding:6px 18px;font-size:var(--doc-fs);overflow:hidden;position:relative}
.taskbar{height:34px;flex:none;background:var(--taskbar);display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#fff;font-size:14px}
.tb-start{width:26px;height:26px;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.tb-start i{background:#7CC4FF;border-radius:1px}
.tb-right{display:flex;align-items:center;gap:12px}
.tb-lamp{display:flex;align-items:center;gap:6px;color:#C9D3DD}
.tb-lamp i{width:12px;height:12px;border-radius:50%;background:#4A5867;border:2px solid #0E151C}
.tb-lamp i.on{background:#5BF07A;box-shadow:0 0 10px #5BF07A}
.tb-ime{width:30px;height:28px;border-radius:6px;background:#fff;color:var(--ink);font-weight:900;display:grid;place-items:center;font-size:16px}
.blinkbg{animation:blinkbg .7s ease-in-out infinite}
@keyframes blinkbg{50%{background:var(--hl);transform:scale(1.15)}}

.doc .ln{white-space:pre;line-height:1.55;min-height:1.55em;border-bottom:1px dashed #E1E8EE;position:relative}
.caret{display:inline-block;width:3px;height:1.05em;background:#1673D6;vertical-align:-.12em;animation:blink 1s steps(1) infinite;margin:0 1px}
@keyframes blink{50%{opacity:0}}
.m-red{color:var(--bad);background:#FFE1E1;border-radius:4px;animation:redblink .6s ease-in-out infinite;padding:0 2px}
@keyframes redblink{50%{background:#FFB7B7}}
.m-star{display:inline-block;width:0;position:relative;vertical-align:top}
.m-star::after{content:"★";position:absolute;left:-.42em;top:-.62em;font-size:.85em;color:var(--gold);text-shadow:1px 1px 0 var(--ink);animation:bounce .7s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-5px)}}
.m-gap{display:inline-block;width:.7em;height:1em;vertical-align:-.15em;border-bottom:4px solid #1673D6;background:rgba(22,115,214,.12);border-radius:3px;animation:redblink .6s infinite}

.frow{display:flex;align-items:center;gap:12px;margin-bottom:6px;font-size:.8em}
.frow span{width:3em;flex:none}
.fld{flex:1;border:3px solid var(--cap-edge);border-radius:8px;padding:0 10px;min-height:1.6em;background:#fff;display:flex;align-items:center}
.fld.on{border-color:#1673D6;box-shadow:0 0 0 4px rgba(22,115,214,.22)}
.win-body:has(.frow){display:flex;gap:14px;align-items:flex-start;padding-top:14px}
.win-body .frow{flex:1;min-width:0;flex-direction:column;align-items:stretch;gap:4px;margin:0;font-size:.85em}
.win-body .frow span{width:auto;font-weight:700}
.win-body .fld{width:100%;min-height:1.9em}
.win-body .fld.next{border-width:4px;border-style:dashed;border-color:var(--gold);background:#FFF6CC;position:relative}
.win-body .fld.next::after{content:"下一格";position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.7em;font-weight:900;color:var(--mid)}

.big-demo{height:100%;display:flex;align-items:center;justify-content:center;gap:5%;flex-wrap:wrap}
.lampbig{width:1.4em;height:1.4em;border-radius:50%;border:3px solid var(--ink);background:#CFD6DC;flex:none}
.lampbig.on{background:#59E36B;box-shadow:0 0 22px #59E36B}
.sample{font-family:var(--f-key);font-weight:600;font-size:2.1em;letter-spacing:.04em}
.sample.zh{font-family:var(--f-body);font-weight:900}
.ghost{opacity:.35;border:3px dashed var(--ink-soft);border-radius:12px;padding:0 .3em}
.arrowto{font-size:1.4em;color:var(--ink-soft)}
.imebig{width:2.2em;height:2.2em;border-radius:14px;border:3px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:1.3em;background:var(--wash);flex:none}
.imebig.zh{background:#FFE3D6}
.imebig.en{background:#DCEEFF}

.pop{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(72%,360px);background:#fff;border:3px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 rgba(0,0,0,.3);z-index:3;animation:popin .25s ease-out}
.pop-bar{display:flex;justify-content:space-between;background:var(--g-esc);color:#fff;font-size:14px;font-weight:700;padding:3px 10px;border-bottom:3px solid var(--ink)}
.pop p{padding:16px 12px;text-align:center;font-size:20px;font-weight:900}
.pop.out{animation:popout .28s forwards}
.pop.dlg .pop-bar{background:#1673D6}
.dlg-btns{display:flex;gap:10px;justify-content:center;padding:0 12px 14px}
.dlg-btns span{border:2px solid var(--ink);border-radius:8px;padding:2px 18px;font-weight:700;font-size:16px}
.dlg-btns .okb{background:#1673D6;color:#fff}
.dlg-btns .okb.pulse{animation:okpulse .7s ease-in-out infinite}
.dlg-btns .okb.press{transform:scale(.9);background:var(--good)}
@keyframes okpulse{50%{box-shadow:0 0 0 6px rgba(255,194,51,.8)}}
@keyframes popin{from{transform:translate(-50%,-50%) scale(.6);opacity:0}}
@keyframes popout{to{transform:translate(-50%,-50%) scale(.5);opacity:0}}


.ask{position:absolute;top:14px;right:18px;z-index:6;display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 14px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.ask-l{font-size:14px;font-weight:900;color:var(--ink-soft)}
.ask-use{font-weight:900;font-size:22px}
.ask .chip{font:600 24px var(--f-key);border:2px solid var(--ink);border-radius:10px;padding:0 14px;background:var(--hl)}
.kmon{position:absolute;inset:0;z-index:1;border-radius:14px;box-shadow:none}
.kscene{flex:1;min-height:0}
html[data-kind=key] .dojo{display:none}
html[data-kind=key] #nStage>.scene,html[data-kind=key] #player,html[data-kind=key] #enemyLayer{display:none}
.vlayer{position:absolute;inset:8px 8px 42px;pointer-events:none;z-index:5;overflow:hidden;border-radius:8px}
.vlayer.hit{animation:infect .45s ease-out}
@keyframes infect{0%{background:rgba(229,72,77,.55)}100%{background:transparent}}
.virus{position:absolute;width:clamp(64px,12vh,110px);transform:translate(-50%,-50%);filter:drop-shadow(0 4px 0 rgba(0,0,0,.25));display:grid;justify-items:center}
.virus img{width:100%;display:block;filter:hue-rotate(var(--h,0deg))}
.virus.walk img{animation:wobble .5s ease-in-out infinite alternate}
@keyframes wobble{to{rotate:8deg}}
.virus.tgt img{filter:hue-rotate(var(--h,0deg)) drop-shadow(0 0 5px #FFE066) drop-shadow(0 0 10px #FFE066) drop-shadow(0 0 16px #FFB800)}
.virus.tgt::after{content:'▼ 先處理';position:absolute;top:-1.4em;font:900 13px var(--f-body);color:#fff;background:var(--ink);border-radius:999px;padding:0 8px;white-space:nowrap}
.virus.die{transition:transform .3s,opacity .3s!important;transform:translate(-50%,-50%) scale(.1) rotate(180deg)!important;opacity:0}
.virus.grab{transition:transform .3s!important;transform:translate(-50%,-50%) scale(1.6)!important;opacity:.6}
.virus .vtag{font:900 clamp(14px,2.4vh,20px) var(--f-body);margin-top:-6px;padding:0 10px;border:2px solid var(--ink);border-radius:10px;background:var(--hl);box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.kmon .desk{transition:background .6s}
.kmon[data-stage="2"] .desk{background:linear-gradient(160deg,#F59E42,#FBD38D)}
.kmon[data-stage="3"] .desk{background:linear-gradient(160deg,#6D28D9,#C4B5FD)}
.kmon[data-stage="4"] .desk{background:linear-gradient(160deg,#B91C1C,#F87171)}
.kmon[data-stage="4"]{animation:alarm 1s ease-in-out infinite}
@keyframes alarm{50%{box-shadow:0 0 0 6px rgba(229,72,77,.7)}}
.kmon[data-stage="5"] .desk{background:#0B1220 repeating-linear-gradient(0deg,rgba(91,240,122,.12) 0 2px,transparent 2px 22px)}
.kmon[data-stage="5"]{animation:alarm .6s ease-in-out infinite}
/* 重要按鍵練習（data-kind=key）：整個鍵盤，特殊鍵是練習的鍵 */
.kb.keys{aspect-ratio:16.6/6}
.kb.keys .k{--u:calc(100cqw / 16.6);height:16.66%}
.kb.keys .cap{font:700 calc(var(--u)*.3) var(--f-body);text-transform:none;line-height:1}
.kb.keys .k.ltr .cap{font:600 calc(var(--u)*.36) var(--f-key);text-transform:uppercase}
.kb.keys .k.in .cap{font-weight:900}
html[data-kind=key] .target{font:900 clamp(34px,8vh,76px)/1.25 var(--f-body);letter-spacing:0;text-transform:none}
html[data-kind=key] .target span{margin:.06em .12em;border:3px solid var(--ink);padding:0 .3em;background:#fff;box-shadow:0 5px 0 var(--ink)}
html[data-kind=key] .target span.next{background:var(--hl)}
html[data-kind=key] .word{font:900 clamp(16px,3.4vh,28px)/1.25 var(--f-body);letter-spacing:0;text-transform:none}
html[data-kind=key] .word span{display:inline-block;margin:0 .18em}
html[data-kind=key] .chipk,html[data-kind=key] .setcard .keys{text-transform:none;font-family:var(--f-body);font-weight:900}
html[data-kind=key] .setcard .keys{font-size:18px}
.enemy img{width:100%;display:block;animation:bob .5s ease-in-out infinite alternate}
html[data-kind=key] .word.txt{font-size:clamp(14px,2.6vh,21px);white-space:normal;width:max-content;max-width:min(260px,40vw);text-align:center}
html[data-kind=key] .word.txt span{display:block;margin:2px 0}
.enemy.poof img{animation:poof .35s forwards}

/* 結算 */
.result{display:grid;gap:14px;justify-items:start}
.result h2{font-size:30px}
.r-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.trend{font-weight:900;font-size:18px;border:3px solid var(--ink);border-radius:999px;padding:2px 16px;background:var(--wash)}
.trend.best{background:var(--hl)}
.trend.up{background:#DDF5E7;color:#127A45}
.r-mid{display:flex;align-items:center;gap:8px 22px;flex-wrap:wrap}
.r-stars{font-size:44px;letter-spacing:4px;color:var(--gold);line-height:1}
.r-stars .off{color:var(--cap-dim)}
.r-score{font:600 46px/1 var(--f-key);font-variant-numeric:tabular-nums}
.r-score small{font:900 18px var(--f-body);margin-left:4px}
.r-crown{display:flex;align-items:center;gap:8px;font-weight:900;border:3px solid var(--ink);border-radius:14px;padding:2px 14px 2px 8px;background:#FFF6CC}
.r-crown i{font-size:34px;font-style:normal;line-height:1.2}
.r-stats{display:flex;gap:10px;flex-wrap:wrap}
.r-stats div{border:2px solid var(--ink);border-radius:10px;padding:4px 14px;background:var(--wash)}
.r-stats b{font:600 22px var(--f-key);margin-left:6px}
.r-stats .fc{background:var(--hl);font-weight:900}
.unlock-note{background:var(--hl);border:3px solid var(--ink);border-radius:12px;padding:6px 14px;font-weight:900}
.unlock-note.tip{background:var(--wash)}
.missed{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chipk{font:600 18px var(--f-key);border:2px solid var(--ink);border-radius:8px;padding:0 10px;background:#fff;text-transform:uppercase}
.r-btns{display:flex;gap:10px;flex-wrap:wrap}
.hist{width:100%;max-width:600px;display:grid;gap:6px}
.hist-row{display:grid;grid-template-columns:4.5em 1fr 6em 5.5em;gap:8px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.hist-row .bar{height:16px;border-radius:6px;background:var(--cap-dim);overflow:hidden}
.hist-row .bar i{display:block;height:100%;background:var(--c-mid);border-radius:6px}
.hist-row.best .bar i{background:var(--gold)}
.hist-row.now{font-weight:900}
.hist-row.now .bar i{background:var(--c-top)}
.hist-row span:nth-child(3),.hist-row span:nth-child(4){text-align:right}
.hs{color:var(--gold)}

/* 簽到、獎狀 */
.modal-wrap{position:fixed;inset:0;z-index:40;background:rgba(27,40,54,.6);display:grid;place-items:center;padding:16px;overflow:auto}
.signin{width:min(480px,100%);display:grid;gap:12px}
.signin h2{font-size:30px}
.signin input{font:600 40px var(--f-key);letter-spacing:.3em;text-align:center;border:3px solid var(--ink);border-radius:12px;padding:4px 10px;width:100%}
.signin .hint{font-size:15px;color:var(--ink-soft);font-weight:700}
.signin .preview{font:900 24px var(--f-display);min-height:1.5em;text-align:center}
.signin .preview.err{color:var(--bad);font:900 16px var(--f-body)}
.nmfield{display:grid;gap:4px;font-weight:900}
.nmfield small{display:block;font-size:13px;color:var(--ink-soft);font-weight:700}
.signin .nmfield input{font:700 30px var(--f-body);letter-spacing:.1em}
.cert-wrap{position:fixed;inset:0;z-index:50;background:rgba(27,40,54,.65);display:grid;place-items:center;padding:16px;overflow:auto}
.cert{width:min(720px,100%);background:#FFFDF4;border:4px solid var(--ink);border-radius:18px;box-shadow:8px 8px 0 var(--ink);padding:14px;animation:popcert .4s ease-out}
@keyframes popcert{from{transform:scale(.7);opacity:0}}
.cert-in{position:relative;border:6px double var(--gold);border-radius:10px;padding:18px 22px 24px;text-align:center;background:radial-gradient(circle at 0 0,#FFE9A8 0 40px,transparent 41px),radial-gradient(circle at 100% 0,#FFE9A8 0 40px,transparent 41px),radial-gradient(circle at 0 100%,#FFE9A8 0 40px,transparent 41px),radial-gradient(circle at 100% 100%,#FFE9A8 0 40px,transparent 41px)}
.cert-kicker{font-weight:900;color:var(--ink-soft);letter-spacing:.3em}
.cert-sub{font:700 24px var(--f-display);letter-spacing:.6em;margin:2px 0 8px}
.cert-title{font-size:clamp(38px,7vh,58px);letter-spacing:.12em;color:var(--mid);margin:4px 0}
.cert-body{font-size:19px;line-height:2;font-weight:700}
.cert-scores{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.cert-scores div{border:2px solid var(--ink);border-radius:12px;padding:2px 12px;background:#fff;font-weight:900;font-size:14px}
.cert-date{color:var(--ink-soft);font-weight:700;margin-top:6px}
.cert-seal{position:absolute;right:18px;bottom:16px;width:78px;height:78px;border-radius:50%;border:4px solid var(--bad);color:var(--bad);display:grid;place-items:center;font-weight:900;font-size:15px;line-height:1.2;transform:rotate(-12deg);background:rgba(255,255,255,.6)}
.cert-empty{font-size:20px;font-weight:900;padding:30px 10px;line-height:1.8}
.cert{position:relative;overflow:hidden}
.cert-grade{display:inline-block;font:900 20px var(--f-body);border:3px solid var(--ink);border-radius:999px;padding:2px 16px;margin:2px 0 4px;background:#fff}
.cert.g-blue .cert-in{border-color:#3A9FEF;background:#F4FAFF}
.cert.g-blue .cert-grade{background:#DCEFFF}
.cert.g-bronze .cert-in{border-color:#B8733A;background:linear-gradient(160deg,#FFF6EC,#F6DEC6)}
.cert.g-bronze .cert-grade{background:#F0C9A0}
.cert.g-bronze .cert-title{color:#8A4B1C}
.cert.g-silver .cert-in{border-color:#9AA7B4;background:linear-gradient(160deg,#FFFFFF,#E3E9EF)}
.cert.g-silver .cert-grade{background:#DDE3EA}
.cert.g-silver .cert-title{color:#5A6878}
.cert.g-gold .cert-in{border-color:#D4A017;border-width:8px;background:linear-gradient(160deg,#FFFBEA,#FFE8A3)}
.cert.g-gold .cert-grade{background:linear-gradient(#FFE27A,#F5B700)}
.cert.g-gold .cert-title{color:#A86A00;text-shadow:2px 2px 0 #FFF2B8}
.confetti{position:absolute;top:-16px;width:9px;height:16px;border-radius:2px;z-index:5;pointer-events:none;animation:conf 3s linear infinite}
@keyframes conf{0%{top:-16px;opacity:1}85%{opacity:1}100%{top:105%;opacity:0;margin-left:40px}}
@media print{ .confetti{display:none} }
@media print{ body>*:not(.cert-wrap){display:none!important} .cert-wrap{position:static;background:none;padding:0} .cert{box-shadow:none} .cert .r-btns{display:none} }
.focus-pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:#fff;border:3px solid var(--hl);border-radius:999px;padding:10px 22px;font:700 16px var(--f-body);cursor:pointer;max-width:calc(100% - 32px)}
@media (max-width:720px){ html,body{height:auto} .wrap{height:auto} .stage{min-height:360px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="tagk">ASDF</span><h1 id="title">打字忍者</h1><span class="badge ver" id="verBadge">字母打字</span><span class="who" id="who" hidden title="點一下可以重新輸入班級座號"></span></div>
    <div id="hud" class="hud" hidden></div>
    <div class="row">
      <button class="btn sm" id="soundBtn" type="button">聲音：開</button>
      <button class="btn sm navout" id="setsBtn" type="button" hidden>換練習範圍</button>
      <button class="btn sm" id="homeBtn" type="button" hidden>回關卡選單</button>
    </div>
  </header>
  <main>
    <section data-screen="sets" hidden>
      <div class="intro"><h2>選擇要練習的字母</h2><p>先選一排，三個關卡都會用這一排的字母出題。每一排的紀錄分開算。</p></div>
      <div id="demoBar1"></div>
      <div class="sets" id="sets"></div>
      <nav class="footnav"><a class="btn sm navout" href="typing.html">⬅ 回上頁</a><a class="btn sm navout" href="index.html">🏠 回目錄</a></nav>
    </section>
    <section data-screen="check" hidden>
      <div class="card check">
        <h2>🔍 開始前：檢查輸入法</h2>
        <ol class="chk-steps"><li>看螢幕右下角：要是「<b>中</b>」（是「英」就按一下 <b>Shift</b>）</li><li>點下面的格子，<b>按住 Ctrl</b> 再按題目的鍵</li><li>符號下面出現橘色虛線時，按 <b>Enter</b> 送出</li></ol>
        <div class="chk-list" id="chkList"></div>
        <input id="chkIn" class="tin" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="試打格子">
        <p class="thint" id="chkMsg"></p>
        <div class="r-btns"><button class="btn primary" type="button" id="chkGo" disabled>開始練習！</button><button class="btn" type="button" id="chkSkip" hidden>跳過（老師示範）</button></div>
      </div>
      <nav class="footnav"><a class="btn sm navout" href="typing.html">⬅ 回上頁</a><a class="btn sm navout" href="index.html">🏠 回目錄</a></nav>
    </section>
    <section data-screen="home" hidden>
      <div id="demoBar2"></div>
      <div id="entries" class="entries"></div>
      <div id="tpanel" class="card tpanel" hidden></div>
      <nav class="footnav"><button class="btn sm navout" type="button" id="backSets">⬅ 換練習範圍</button><button class="btn sm" type="button" id="reCheck" hidden>🔍 再檢查一次輸入法</button><a class="btn sm navout" href="index.html">🏠 回目錄</a></nav>
    </section>

const CN = ['','一','二','三','四','五','六','七','八','九','十'];
const cnNum = n => n <= 10 ? CN[n] : n < 20 ? '十' + CN[n-10] : CN[Math.floor(n/10)] + '十' + CN[n%10];
function parseCode(s){
  if (!/^\d{5}$/.test(s)) return {err: s.length ? `要打 5 個數字（現在 ${s.length} 個）` : ''};
  const g = +s[0], c = +s.slice(1,3), n = +s.slice(3,5);
  if (g < 1 || g > 6) return {err:'第 1 個數字是年級，要是 1～6'};
  if (c < 1 || c > CFG.classes) return {err:`第 2、3 個數字是班級，要是 01～${String(CFG.classes).padStart(2,'0')}`};
  if (n < 1 || n > CFG.seats) return {err:`最後 2 個數字是座號，要是 01～${String(CFG.seats).padStart(2,'0')}`};
  return {code:s, cls:`${CN[g]}年${cnNum(c)}班`, seat:n, text:`${CN[g]}年${cnNum(c)}班 ${n} 號`};
}

/* ---------- 錯題權重（規格書第 7 節，以字母為單位） ---------- */
const wOf = k => Math.min(WEIGHT.max, P.weight[k] || WEIGHT.base);
function pickWeighted(pool, avoid){
  const c = pool.filter(k => k !== avoid); const tot = c.reduce((s,k) => s + wOf(k), 0);
  let r = Math.random()*tot; for (const k of c){ r -= wOf(k); if (r < 0) return k; } return c[c.length-1];
}
function learn(k, judge, rt){
  const avg = P.rtN >= WEIGHT.minSamples ? P.rtSum/P.rtN : null;
  let w = P.weight[k] || WEIGHT.base, weak = false;
  if (judge==='bad'){ w += WEIGHT.bad; weak = true; }
  else if (judge==='ok' || (avg && rt > avg*WEIGHT.slowRatio)){ w += WEIGHT.slow; weak = true; }
  else w = Math.max(WEIGHT.base, w - WEIGHT.recover);
  P.weight[k] = Math.min(WEIGHT.max, w);
  if (rt!=null && judge!=='bad'){ P.rtSum += rt; P.rtN++; }
  return weak;
}
/* 第一關出題：第 1 次每個字母至少出現一次；第 2、3 次完全依權重抽（不熟的字母出現得多） */
function l1Queue(){
  const keys = KEYS(); let q = [];
  if (P.l1.plays === 0){ q = shuffle(keys.slice()).slice(0, L1.n); while (q.length < L1.n) q.push(pickWeighted(keys, q[q.length-1])); q = shuffle(q); }
  else { for (let i=0;i<L1.n;i++) q.push(pickWeighted(keys, q[i-1])); }
  for (let i=1;i<q.length;i++) if (q[i]===q[i-1]){ const j = q.findIndex((x,t) => t>i && x!==q[i] && q[t-1]!==q[i] && q[t+1]!==q[i]); if (j>0) [q[i],q[j]]=[q[j],q[i]]; }
  return q;
}
function makeWord(len){ const keys = KEYS(); let w = ''; for (let i=0;i<len;i++) w += keys.length > 1 ? pickWeighted(keys, w[w.length-1]) : keys[0]; return w; }

  if (v > prev) return {cls:'up', text:'⬆ 比上一次進步了！'};
  if (prev - v <= flat) return {cls:'flat', text:'💪 穩住了！'};
  return {cls:'again', text:'🔁 再挑戰一次？'};
}
function showResult(title, trend, mid, stats, fc, notes, weak, heavy, hist, histR, max, again, nextBtn, nextFn){
  show('result');
  const best = Math.max(...hist.map(h => h.score)), last = hist.length-1, mx = Math.max(max||1, best, 1);
  $('#resultBox').innerHTML = `
    <div class="r-top"><h2>${H(title)}</h2><span class="trend ${trend.cls}">${trend.text}</span></div>
    <div class="r-mid">${mid}</div>
    <div class="r-stats">${stats.map(s => `<div>${s[0]}<b>${s[1]}</b></div>`).join('')}${fc ? '<div class="fc">全連段！</div>' : ''}</div>
    ${notes.join('')}
    <div class="missed">${weak.size ? `<b>這一輪可以多練：</b>${[...weak].slice(0,8).map(chip).join('')}` : '<b>每一個都又快又對，太厲害了！</b>'}</div>
    ${heavy.length ? `<div class="missed"><b>下一輪會多出現：</b>${heavy.map(chip).join('')}</div>` : ''}
    <div class="hist"><b>這節課的紀錄</b>${hist.map((h,i) => `<div class="hist-row ${i===last?'now':''} ${h.score===best?'best':''}"><span>${i===last?'這次':h.at}</span><span class="bar"><i style="width:${Math.round(h.score/mx*100)}%"></i></span><span>${h.score===best?'🏅 ':''}${h.score}</span><span class="hs">${histR(h)}</span></div>`).join('')}</div>
    <div class="r-btns"><button class="btn primary" type="button" id="rAgain">再玩一次</button>${nextBtn}<button class="btn" type="button" id="rHome">回關卡選單</button></div>`;
  $('#rAgain').onclick = again; $('#rHome').onclick = () => show('home');
  if ($('#rNext')) $('#rNext').onclick = nextFn;
}

const DL = [['香香蕉',0],['我的的書',1],['小小狗',0],['今天天氣',1],['Catt',3]];
const SP = [['Goodmorning',4],['Helloworld',5],['Thankyou',5],['Seeyou',3],['Goodnight',4]];
const AR = [['我是三年級的學生','今天要上電腦課'],['小狗在公園跑步','小貓在家裡睡覺'],['明天要去郊遊','記得帶便當和水']];

const rn = n => Math.floor(Math.random()*n);
function situation(id){
  switch(id){
    case 'esc': return {lines:['今天的作業寫到一半……'], c:11, popup:rnd(POPUPS)};
    case 'shift': { const now = rnd(['中','英']); return {view:'ime', ime:now, wantIme: now==='中'?'英':'中', imeBlink:true}; }
    case 'caps': { const on = Math.random()<.5; return {view:'caps', caps:on, sample:rnd(['apple','cat','book','sun','dog']), wantCase: on?'low':'up', capsBlink:true}; }
    case 'bksp': { const w = rnd(BK); return {lines:[w], c:w.length, red:[0,w.length-1]}; }
    case 'del': { const d = rnd(DL); return {lines:[d[0]], c:d[1], red:[0,d[1]]}; }
    case 'space': { const s = rnd(SP); return {lines:[s[0]], c:s[1], gap:[0,s[1]]}; }
    case 'enter': return {lines:['作業做好了！'], c:6, dialog:rnd(DIALOGS), okPulse:true};
    case 'tab': { const f = rnd(FORMS).map(x=>x.slice()), cur = rn(2); f[cur+1][1] = ''; return {view:'form', title:'報名表', form:{fields:f, f:cur}, nextBlink:true}; }
    default: {
      const L = rnd(AR).slice(); let r, c, star;
      if (id==='left'){ r=rn(2); c=1+rn(L[r].length); star=[r,c-1]; }
      if (id==='right'){ r=rn(2); c=rn(L[r].length); star=[r,c+1]; }
      const m = Math.min(L[0].length, L[1].length);
      if (id==='up'){ r=1; c=rn(m+1); star=[0,c]; }
      if (id==='down'){ r=0; c=rn(m+1); star=[1,c]; }
      return {lines:L, r, c, star};
    }
  }
}

function vStart(id){

    + `看電腦畫面的狀況，按下可以解決的鍵（發光的病毒先處理）。擊退 ${C.goal} 隻就通關，被病毒碰到電腦才扣命。`, () => {
    if (N!==d) return; N.locked = false; N.nextAt = 0; cancelAnimationFrame(loop); loop = requestAnimationFrame(vTick); });
}
function vTarget(){ return N.es[0] || null; }
function vSyncScene(){
  const t = vTarget();
  N.es.forEach((e,i) => e.el.classList.toggle('tgt', i === 0));
  if (!t){ N.sceneTok = null; return; }
  if (N.sceneTok !== t){ N.sceneTok = t; kS2.load(situation(KEYDEF[t.tok].id)); kb.clear(); }
}
function vSpawn(){
  const C = N.C, keys = KEYS(), tok = keys.length > 1 ? pickWeighted(keys, N.lastTok) : keys[0];
  if (N.es.some(e => e.tok === tok) && keys.length > N.es.length + 1) return false;   /* 同時出現的病毒不要一樣 */
  N.lastTok = tok;
  const side = Math.floor(Math.random()*6);   /* 上、左、右、四個角落 */
  const from = side===0 ? {x:8+Math.random()*84, y:4} : side===1 ? {x:4, y:8+Math.random()*80} : side===2 ? {x:96, y:8+Math.random()*80}
    : side===3 ? {x:5, y:5} : side===4 ? {x:95, y:5} : {x:Math.random()<.5?5:95, y:92};
  const el = document.createElement('div'); el.className = 'virus walk';
  el.innerHTML = `<img src="${VIRUS_IMG}" alt="病毒" style="--h:${(themeOf(C,N.stage)-1)*55}deg">` + (C.tag ? `<b class="vtag">${H(SHOW(tok))}</b>` : '');
  el.style.left = from.x + '%'; el.style.top = from.y + '%';
  $('#vLayer').appendChild(el);

}
function vTick(now){
  if (!N || N.over || screen!=='ninja') return;
  if (!N.locked && paused==null){
    if (N.es.length < maxNow() && N.kills + N.es.length < N.C.goal && (N.es.length === 0 || now >= N.nextAt) && now >= N.holdUntil0){
      if (vSpawn()) N.nextAt = now + N.C.gap*1000;
    }
    const t = vTarget();
    if (t && N.C.glowAfter != null && !t.glowed && now - t.start >= N.C.glowAfter*1000){ t.glowed = true; kb.glow(t.tok); }
    for (const e of N.es.slice()){
      const p = Math.min(1, (now - e.start) / (e.dur*1000));
      e.el.style.left = (e.from.x + (e.to.x - e.from.x)*p) + '%'; e.el.style.top = (e.from.y + (e.to.y - e.from.y)*p) + '%';
      e.el.style.transform = `translate(-50%,-50%) scale(${.6 + .7*p})`;
      if (p >= 1){ vReach(e); if (!N || N.locked) break; }
    }
  }
  loop = requestAnimationFrame(vTick);
}
function vPress(tok){
  if (!N || N.locked || paused != null) return;
  const t = vTarget(); if (!t) return;
  if (tok === t.tok) return vDefeat(t);

  N.combo = 0; if (!t.missed){ t.missed = true; learn(t.tok,'bad',null); N.weak.add(t.tok); save(); }
  kb.els(tok).forEach(x => { x.classList.add('no'); setTimeout(() => x.classList.remove('no'), 400); });
  Sound.bad(); remind('按錯了！看清楚電腦畫面出了什麼狀況');
}
function vDefeat(e){
  const rt = (performance.now() - e.start)/1000, remFrac = Math.max(0, 1 - rt/e.dur);
  const pts = SCORE.base + Math.round(SCORE.speed * remFrac);
  N.score += pts; N.kills++; N.combo++; N.maxCombo = Math.max(N.maxCombo, N.combo); N.rts.push(rt);
  if (!e.missed && learn(e.tok, remFrac > .5 ? 'good' : 'ok', rt)) N.weak.add(e.tok); save();
  kS2.apply(KEYDEF[e.tok].id); N.es = N.es.filter(x => x !== e); N.sceneTok = e;   /* 先讓畫面播完「解決了」再換下一隻 */
  e.el.classList.remove('walk','tgt'); e.el.classList.add('die'); setTimeout(() => e.el.remove(), 350);

  const p = document.createElement('div'); p.className = 'pts'; p.textContent = `+${pts}`; p.style.left = e.el.style.left; p.style.bottom = '58%'; $('#vLayer').appendChild(p); setTimeout(() => p.remove(), 900);
  kb.clear(); ninjaHud();
  if (N.kills >= N.C.goal) return ninjaWin();
  const n = N; setTimeout(() => { if (N === n) vSyncScene(); }, 600);
  const st = stageOfKills(N.C, N.kills);
  if (st > N.stage){ N.stage = st; N.holdUntil0 = performance.now() + 1700; setTimeout(() => { if (N===n){ $('#kMon2').dataset.stage = String(themeOf(n.C, st)); setTheme(themeOf(n.C, st), st); ninjaHud(); } }, 300); }
  else if (!N.es.length) N.holdUntil0 = performance.now() + 650;
}
function vReach(e){
  N.combo = 0; learn(e.tok,'bad',null); N.weak.add(e.tok); save();
  N.es = N.es.filter(x => x !== e); e.el.classList.remove('walk','tgt'); e.el.classList.add('grab'); setTimeout(() => e.el.remove(), 400);

  N.holdUntil0 = performance.now() + 900; N.sceneTok = e;
  loseLife(`病毒感染電腦了！要按「${SHOW(e.tok)}」`);
}

/* ---------- 打字欄位與鍵盤事件 ----------
   學生要自己切換成英文輸入法：欄位裡出現注音或中文字，就提醒按 Shift；英文打對了自動送出，不用按 Enter。

const tin = $('#tin');
/* 選字中的橘色虛線（老師 2026-10-30：比照一般打字，有虛線 → 按 Enter 虛線消失、同時判定 → 下一題）
   瀏覽器在輸入框裡不一定畫得出底線，所以網頁自己量字的寬度，在字下面畫一條虛線 */
function compLine(inp, on){
  let d = inp._cl; if (!d){ d = inp._cl = document.createElement('div'); d.className = 'compline'; d.hidden = true; document.body.appendChild(d); }
  if (!on || !inp.value){ d.hidden = true; return; }
  const cs = getComputedStyle(inp), cv = compLine.cv || (compLine.cv = document.createElement('canvas').getContext('2d'));
  cv.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const fs = parseFloat(cs.fontSize), ls = parseFloat(cs.letterSpacing) || 0, n = [...inp.value].length;
  const w = Math.max(fs * .6, cv.measureText(inp.value).width + ls * n), r = inp.getBoundingClientRect();
  d.style.left = (r.left + r.width/2 - w/2) + 'px'; d.style.width = w + 'px'; d.style.top = (r.top + r.height/2 + fs*.62) + 'px'; d.hidden = false;
}
let composing = false, remindT = 0;
function remind(text){ const el = screen==='ninja' ? $('#nRemind') : $('#dRemind'); el.hidden = false; el.textContent = text; clearTimeout(remindT); remindT = setTimeout(() => el.hidden = true, 2200); }
function tinState(kind, msg){ if (KIND === 'key'){ if (kind === 'bad' && msg) remind(msg); return; } tin.classList.toggle('bad', kind==='bad'); tin.classList.toggle('ime', kind==='ime'); const h = $('#thint'); h.className = 'thint' + (kind==='bad' ? ' bad' : kind==='ime' ? ' warn' : ''); h.textContent = msg || ''; }
function tinReset(){ tin.value = ''; composing = false; tin.classList.remove('comp'); compLine(tin, false); tinState(''); if (N) { N.lastLen = 0; N.badLen = 0; } }
function focusTin(){ if (!$('#typeZone').hidden && $('#signWrap').hidden && $('#certWrap').hidden) tin.focus({preventScroll:true}); }
const IME_MSG = '輸入法是中文喔！按一下 Shift 換成英文（看到ㄅㄆㄇ或中文字，就是還沒切換）';
const HALF_MSG = '打出來是半形（英文）的符號，算打錯：輸入法換成「中」，按住 Ctrl 再按符號鍵。按 Backspace 刪掉再打';
tin.addEventListener('compositionstart', () => { composing = true;
  if (KIND === 'en'){ tinState('ime', IME_MSG); remind('輸入法是中文喔！按一下 Shift 換成英文'); }
  else { tin.classList.add('comp'); tinState('', '看到橘色虛線：按 Enter 送出'); compLine(tin, true); } });
tin.addEventListener('compositionupdate', () => { if (KIND === 'punc') setTimeout(() => compLine(tin, composing), 0); });

function onTin(){
  const raw = tin.value;
  if (KIND === 'punc'){
    /* 標點：只接受全形標點。半形（英文）符號＝沒按 Ctrl 或沒切成全形：提醒、不算答錯；注音、字母、中文字＝打錯 */
    const v = raw.replace(/\s+/g,'');

    else if (/[^，。、；：？！]/.test(v)) tinState('bad', '這不是標點符號：按住 Ctrl 再按符號鍵。按 Backspace 刪掉再打');
    return;
  }
  if (/[^\x00-\x7F]/.test(raw)){ tinState('ime', IME_MSG); remind('輸入法是中文喔！按一下 Shift 換成英文'); return; }   /* 注音、中文字：不算答錯，請學生刪掉、切換 */

      <div class="cert-scores"><div>第一關・最佳 ${P.l1.best!=null ? P.l1.best + ' 分' : '—'}</div>${KIND === 'key' ? '' : `<div>${P.l2.crown ? '👑 ' : ''}第二關・最佳 ${P.l2.best!=null ? P.l2.best + ' 分' : '—'}</div>`}${nin}</div>
      <p class="cert-date">${todayStr()}${preview && ti < 0 ? '（預覽）' : ''}</p><div class="cert-seal">資訊課<br>認證</div>`;
  }
  const gi2 = ti < 0 && !preview ? -1 : Math.max(0, gradeIndex()), cert = document.querySelector('.cert');
  cert.className = 'cert' + (gi2 >= 0 ? ' g-' + GRADES[gi2].id : '');
  cert.querySelectorAll('.confetti').forEach(x => x.remove());
  if (gi2 === 4){   /* 彩帶動畫 */
    const cols = ['#E5484D','#F5B700','#3A9FEF','#2BB673','#9466EE','#FF8A3D'];
    for (let i = 0; i < 46; i++){ const c = document.createElement('i'); c.className = 'confetti';
      c.style.left = (Math.random()*100) + '%'; c.style.background = cols[i % cols.length];
      c.style.animationDelay = (Math.random()*1.6) + 's'; c.style.animationDuration = (2.2 + Math.random()*1.8) + 's';
      c.style.transform = `rotate(${Math.random()*360}deg)`; cert.appendChild(c); }
    [523,659,784,1047,1319,1568].forEach((f,i) => Sound.tone(f,.28,'triangle',i*.1,.12));
  }
  $('#certWrap').hidden = false; Sound.win();
}
$('#certClose').onclick = () => { $('#certWrap').hidden = true; };
$('#certPrint').onclick = () => window.print();
/* 小機關：連點左上角的黃色鍵帽 3 下（2 秒內）。遊戲進行中鍵帽會收起來，所以只會在選單、結算畫面叫出來。
   每次都依「現在的紀錄」產生，之後再練習、關掉再打開，下次叫出來的獎狀也會跟著更新 */
(function(){
  let n = 0, t = 0;
  document.querySelector('.tagk').addEventListener('click', () => {
    n++; clearTimeout(t); t = setTimeout(() => n = 0, 2000);
    if (n >= 3 && !(screen==='drill' || screen==='ninja') && $('#signWrap').hidden){ n = 0; showAward(false); }
  });
})();

/* ---------- 老師隱藏設定：連點標題 5 下 ---------- */
(function(){
  let clicks = 0, t = 0;
  $('#title').addEventListener('click', () => {
    clicks++; clearTimeout(t); t = setTimeout(() => clicks = 0, 2000);
    if (clicks >= 5 && screen==='home'){ clicks = 0; renderPanel(); $('#tpanel').hidden = false; $('#tpanel').scrollIntoView({behavior:'smooth'}); }
  });
  function renderPanel(){
    $('#tpanel').innerHTML = `<div class="row"><b>老師設定</b>
      <button class="btn sm" type="button" id="tAward">預覽獎狀</button>
      <button class="btn sm" type="button" id="tUnlock">解鎖全部</button>
      <button class="btn sm" type="button" id="tReset">清除這台電腦的紀錄</button>
      <button class="btn sm" type="button" id="tClose">關閉</button></div>
      <p class="tnote">叫出獎狀：連點左上角黃色鍵帽 3 下。老師示範：網址後面加 #demo。要指定${PK.unit}，請到「中英文打字修練 → ${PK.setupName}」（${PK.setup}）。</p>`;
    $('#tAward').onclick = () => showAward(true);
    $('#tUnlock').onclick = () => { P.unlock = true; save(); renderHome(); };
    let arm = false;
    $('#tReset').onclick = () => {
      if (!arm){ arm = true; $('#tReset').textContent = '再按一次確認（清除所有範圍）'; setTimeout(() => { arm = false; const b = $('#tReset'); if (b) b.textContent = '清除這台電腦的紀錄'; }, 3000); return; }
      try{ Object.keys(localStorage).filter(k => k.indexOf(PK.store)===0).forEach(k => localStorage.removeItem(k)); }catch(e){}
      loadSet(SET); $('#tReset').textContent = '已清除'; renderHome();
    };
    $('#tClose').onclick = () => $('#tpanel').hidden = true;
  }
})();

/* ---------- 環境檢測（標點，老師 2026-10-29）：開始前確認輸入法是中文、會用 Ctrl＋符號鍵、知道要按 Enter ---------- */
const CHK = [{ch:'，', how:'Ctrl ＋ ,'}, {ch:'？', how:'Ctrl ＋ Shift ＋ /'}];
let CHECKED = false, chkI = 0, chkComp = false;
function afterSign(){ show(KIND === 'punc' && !CHECKED ? 'check' : SET ? 'home' : 'sets'); }
function chkDraw(){
  $('#chkList').innerHTML = CHK.map((c,i) => `<div class="chk-item ${i<chkI?'ok':i===chkI?'now':''}"><b>${c.ch}</b><span>${PUNC[c.ch].name}：${c.how}</span></div>`).join('');
  $('#chkGo').disabled = chkI < CHK.length;
}
function chkStart(){
  chkI = 0; chkComp = false; const i = $('#chkIn'); i.value = ''; i.className = 'tin'; i.disabled = false; compLine(i, false);
  $('#chkMsg').className = 'thint'; $('#chkMsg').textContent = '先點一下格子，再打第一個符號';
  $('#chkSkip').hidden = !DEMO; chkDraw(); setTimeout(() => { if (screen==='check' && $('#signWrap').hidden) i.focus(); }, 60);
}
function chkSay(kind, t){ const m = $('#chkMsg'), i = $('#chkIn'); m.className = 'thint' + (kind==='bad' ? ' bad' : kind==='warn' ? ' warn' : ''); m.textContent = t; i.className = 'tin' + (chkComp ? ' comp' : '') + (kind==='bad' ? ' bad' : kind==='warn' ? ' ime' : ''); }
function chkTest(){
  const i = $('#chkIn'), v = i.value.replace(/\s+/g,''); if (!v || chkI >= CHK.length) return;
  const want = CHK[chkI].ch;
  if (v === want){
    Sound.good(); chkI++; i.value = ''; chkDraw();
    if (chkI >= CHK.length){ CHECKED = true; saveSess(); i.disabled = true; chkSay('', '✓ 輸入法設定好了！按「開始練習！」'); Sound.win(); $('#chkGo').focus(); }
    else chkSay('', `✓ 很好！再打「${CHK[chkI].ch}」（${CHK[chkI].how}）`);
    return;
  }
  Sound.bad();
  if (/[,.;:?!'"]/.test(v)) chkSay('bad', '打出來是半形（英文）符號：右下角要是「中」，按一下 Shift 切換；按 Backspace 刪掉再打');
  else if (/[\u3105-\u3129\u02CA\u02C7\u02CB\u02D9]/.test(v)) chkSay('bad', '出現注音了：要先按住 Ctrl，再按符號鍵；按 Backspace 刪掉再打');
  else if (/[A-Za-z]/.test(v)) chkSay('bad', '打出英文字母了：右下角要是「中」，再按住 Ctrl 按符號鍵；按 Backspace 刪掉再打');
  else if (/[，。、；：？！]/.test(v)) chkSay('bad', `打出來的不是「${want}」：看清楚要按哪個鍵（${CHK[chkI].how}）；按 Backspace 刪掉再打`);
  else chkSay('bad', `要打的是「${want}」（${CHK[chkI].how}）；按 Backspace 刪掉再打`);
}
(function(){
  const i = $('#chkIn');
  i.addEventListener('compositionstart', () => { chkComp = true; i.classList.add('comp'); chkSay('', '看到橘色虛線了！按 Enter 送出'); setTimeout(() => compLine(i, chkComp), 0); });
  i.addEventListener('compositionupdate', () => setTimeout(() => compLine(i, chkComp), 0));
  i.addEventListener('compositionend', () => { chkComp = false; i.classList.remove('comp'); compLine(i, false); setTimeout(chkTest, 0); });
  i.addEventListener('input', e => { if (e.isComposing || chkComp){ compLine(i, true); return; } if (!i.value){ chkSay('', chkI < CHK.length ? `打「${CHK[chkI].ch}」（${CHK[chkI].how}）` : ''); return; } chkTest(); });
  i.addEventListener('keydown', e => { if (e.key === 'Enter' && !chkComp && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); chkTest(); } });
  $('#chkGo').onclick = () => { Sound.init(); show(SET ? 'home' : 'sets'); };
  $('#chkSkip').onclick = () => { CHECKED = true; show(SET ? 'home' : 'sets'); };
  $('#reCheck').onclick = () => { CHECKED = false; saveSess(); show('check'); };
})();

/* ---------- 啟動 ---------- */
document.querySelector('.tagk').textContent = PK.tag; $('#title').textContent = PK.app; $('#verBadge').textContent = PK.badge;
document.querySelector('.intro h2').textContent = PK.intro[0]; document.querySelector('.intro p').textContent = PK.intro[1];
document.querySelector('.tlabel').innerHTML = PK.tlabel;
if (DEMO){ $('#verBadge').classList.add('demo'); document.title += '・示範'; WHO = {code:'', text:'老師示範'}; renderWho(); }
if (ONE) document.querySelectorAll('.navout').forEach(el => { el.hidden = true; el.classList.add('gone'); });
if (SETS.cus) loadSet('cus');
const resumed = loadSess();
afterSign();
if (!DEMO && !resumed) openSignin();
/* 練習或遊戲進行中不小心按到關閉／重新整理：瀏覽器先問一次（這一局還沒結束，關掉這一局要重玩） */
window.addEventListener('beforeunload', e => { if (!DEMO && (screen==='drill' || screen==='ninja')){ e.preventDefault(); e.returnValue = ''; } });
</script>
