<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鍵盤小勇士（第 1 週・左側鍵）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* 版面：上方標題列＋模擬電腦畫面＋全尺寸鍵盤；貼紙風格（粗黑框＋硬陰影） */
:root{
  --paper:#E3EDF2; --grid:#D0DEE6; --ink:#1B2836; --ink-soft:#4C5D6E; --card:#FFFFFF; --wash:#F3F7FA;
  --case:#26323F; --cap:#F5F7F9; --cap-edge:#AEBBC7; --cap-dim:#D9E1E8; --dim-txt:#8593A1;
  --g-esc:#FF6B4A; --g-left:#3A9FEF; --g-space:#9466EE; --g-edit:#EE4F8B; --g-arrow:#FFC233;
  --good:#1FA963; --bad:#E5484D; --hl:#FFE066; --gold:#F2B400; --mid:#B07D00;
  --desk-a:#4F9BE0; --desk-b:#8CC6EE; --taskbar:#1F2A36;
  --f-display:'LXGW WenKai TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --f-key:'Fredoka','Noto Sans TC',sans-serif;
  --kbh:clamp(150px,36vh,320px); --doc-fs:clamp(18px,3.4vh,30px);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{background:var(--paper)}
body{
  margin:0;
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.6;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
}
.wrap{height:100%;display:flex;flex-direction:column;gap:10px;max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
button{font-family:inherit}

.top{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1{font-size:28px;letter-spacing:.04em;user-select:none}
.brand .tagk{display:inline-block;background:var(--hl);border:3px solid var(--ink);border-radius:10px;padding:0 8px;box-shadow:3px 3px 0 var(--ink);font-family:var(--f-key);font-weight:600;font-size:20px;transform:rotate(-4deg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{font:700 16px var(--f-body);padding:8px 16px;border:3px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .06s}
.btn:hover{background:var(--wash)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--hl)}
.btn.sm{font-size:14px;padding:4px 12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--g-left);outline-offset:3px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:18px}
.badge{display:inline-block;font-size:13px;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:0 10px;background:var(--wash)}
.ver{font-size:14px;background:var(--hl)}

/* ---------- 模擬電腦 ---------- */
.monitor{background:var(--case);border:3px solid var(--ink);border-radius:18px;padding:8px;box-shadow:5px 5px 0 var(--ink);position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
#rvScene,#gScene,#wScene{flex:1;min-height:0}
.desk{height:100%;border-radius:8px;background:linear-gradient(160deg,var(--desk-a),var(--desk-b));position:relative;overflow:hidden;display:flex;flex-direction:column}
.win{position:relative;margin:10px auto 8px;width:min(92%,720px);flex:1;min-height:0;background:#fff;border:2px solid var(--ink);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.win-bar{display:flex;justify-content:space-between;align-items:center;background:#E8EEF3;border-bottom:2px solid var(--ink);padding:2px 10px;font-size:14px;font-weight:700}
.win-bar .ctl{font-family:var(--f-key);letter-spacing:8px;color:var(--ink-soft)}
.win-body{flex:1;min-height:0;padding:6px 18px;font-size:var(--doc-fs);overflow:hidden;position:relative}
.taskbar{height:34px;flex:none;background:var(--taskbar);display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#fff;font-size:14px}
.tb-start{width:26px;height:26px;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.tb-start i{background:#7CC4FF;border-radius:1px}
.tb-right{display:flex;align-items:center;gap:12px}
.tb-lamp{display:flex;align-items:center;gap:6px;color:#C9D3DD}
.tb-lamp i{width:12px;height:12px;border-radius:50%;background:#4A5867;border:2px solid #0E151C}
.tb-lamp i.on{background:#5BF07A;box-shadow:0 0 10px #5BF07A}
.tb-ime{width:30px;height:28px;border-radius:6px;background:#fff;color:var(--ink);font-weight:900;display:grid;place-items:center;font-size:16px}
.blinkbg{animation:blinkbg .7s ease-in-out infinite}
@keyframes blinkbg{50%{background:var(--hl);transform:scale(1.15)}}

.doc .ln{white-space:pre;line-height:1.55;min-height:1.55em;border-bottom:1px dashed #E1E8EE;position:relative}
.caret{display:inline-block;width:3px;height:1.05em;background:#1673D6;vertical-align:-.12em;animation:blink 1s steps(1) infinite;margin:0 1px}
@keyframes blink{50%{opacity:0}}
.m-red{color:var(--bad);background:#FFE1E1;border-radius:4px;animation:redblink .6s ease-in-out infinite;padding:0 2px}
@keyframes redblink{50%{background:#FFB7B7}}
.m-star{display:inline-block;width:0;position:relative;vertical-align:top}
.m-star::after{content:"★";position:absolute;left:-.42em;top:-.62em;font-size:.85em;color:var(--gold);text-shadow:1px 1px 0 var(--ink);animation:bounce .7s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-5px)}}
.m-gap{display:inline-block;width:.7em;height:1em;vertical-align:-.15em;border-bottom:4px solid #1673D6;background:rgba(22,115,214,.12);border-radius:3px;animation:redblink .6s infinite}

.frow{display:flex;align-items:center;gap:12px;margin-bottom:6px;font-size:.8em}
.frow span{width:3em;flex:none}
.fld{flex:1;border:3px solid var(--cap-edge);border-radius:8px;padding:0 10px;min-height:1.6em;background:#fff;display:flex;align-items:center}
.fld.on{border-color:#1673D6;box-shadow:0 0 0 4px rgba(22,115,214,.22)}
.win-body:has(.frow){display:flex;gap:14px;align-items:flex-start;padding-top:14px}
.win-body .frow{flex:1;min-width:0;flex-direction:column;align-items:stretch;gap:4px;margin:0;font-size:.85em}
.win-body .frow span{width:auto;font-weight:700}
.win-body .fld{width:100%;min-height:1.9em}
.win-body .fld.next{border-width:4px;border-style:dashed;border-color:var(--gold);background:#FFF6CC;position:relative}
.win-body .fld.next::after{content:"下一格";position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.7em;font-weight:900;color:var(--mid)}

.big-demo{height:100%;display:flex;align-items:center;justify-content:center;gap:5%;flex-wrap:wrap}
.lampbig{width:1.4em;height:1.4em;border-radius:50%;border:3px solid var(--ink);background:#CFD6DC;flex:none}
.lampbig.on{background:#59E36B;box-shadow:0 0 22px #59E36B}
.sample{font-family:var(--f-key);font-weight:600;font-size:2.1em;letter-spacing:.04em}
.sample.zh{font-family:var(--f-body);font-weight:900}
.ghost{opacity:.35;border:3px dashed var(--ink-soft);border-radius:12px;padding:0 .3em}
.arrowto{font-size:1.4em;color:var(--ink-soft)}
.imebig{width:2.2em;height:2.2em;border-radius:14px;border:3px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:1.3em;background:var(--wash);flex:none}
.imebig.zh{background:#FFE3D6}
.imebig.en{background:#DCEEFF}

.pop{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(72%,360px);background:#fff;border:3px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 rgba(0,0,0,.3);z-index:3;animation:popin .25s ease-out}
.pop-bar{display:flex;justify-content:space-between;background:var(--g-esc);color:#fff;font-size:14px;font-weight:700;padding:3px 10px;border-bottom:3px solid var(--ink)}
.pop p{padding:16px 12px;text-align:center;font-size:20px;font-weight:900}
.pop.out{animation:popout .28s forwards}
.pop.dlg .pop-bar{background:#1673D6}
.dlg-btns{display:flex;gap:10px;justify-content:center;padding:0 12px 14px}
.dlg-btns span{border:2px solid var(--ink);border-radius:8px;padding:2px 18px;font-weight:700;font-size:16px}
.dlg-btns .okb{background:#1673D6;color:#fff}
.dlg-btns .okb.pulse{animation:okpulse .7s ease-in-out infinite}
.dlg-btns .okb.press{transform:scale(.9);background:var(--good)}
@keyframes okpulse{50%{box-shadow:0 0 0 6px rgba(255,194,51,.8)}}
@keyframes popin{from{transform:translate(-50%,-50%) scale(.6);opacity:0}}
@keyframes popout{to{transform:translate(-50%,-50%) scale(.5);opacity:0}}

.banner{position:absolute;top:22px;right:22px;z-index:6;background:var(--ink);color:#fff;border:3px solid #fff;border-radius:14px;padding:6px 16px 6px 8px;display:flex;gap:12px;align-items:center;font-size:22px;font-weight:900;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:opacity .3s,transform .3s}
.banner b{font-family:var(--f-key);font-weight:600;border:2px solid var(--ink);border-radius:10px;padding:0 12px;color:#fff}
.banner b.g-arrow{color:var(--ink)}
.banner.hide{opacity:0;transform:translateY(-8px);pointer-events:none}

/* 提示牌（鷹架）：簡單＝鍵名＋亮燈、普通＝鍵名、困難＝用途、魔王＝不顯示 */
.ask{position:absolute;top:22px;left:22px;z-index:6;display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 14px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.ask-l{font-size:14px;font-weight:900;color:var(--ink-soft)}
.ask .chip{font-size:24px;padding:0 14px}
.ask-use{font-weight:900;font-size:24px}

.fixfx{position:absolute;inset:0;pointer-events:none;z-index:7;display:grid;place-items:center}
.fixfx span{font-family:var(--f-display);font-weight:700;font-size:44px;color:var(--good);background:#fff;border:4px solid var(--good);border-radius:20px;padding:0 22px;animation:fix .7s ease-out forwards}
.fixfx.mid span{color:var(--mid);border-color:var(--gold)}
.fixfx.no span{color:var(--bad);border-color:var(--bad)}
@keyframes fix{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.1);opacity:1}100%{transform:scale(1) translateY(-20px);opacity:0}}

/* ---------- 鍵盤 ---------- */
.kb-zone{flex:none;display:grid;gap:8px}
.kb-case{background:var(--case);border:3px solid var(--ink);border-radius:20px;padding:1.4%;box-shadow:5px 5px 0 var(--ink);width:min(100%,calc(var(--kbh)*3.8));margin-inline:auto}
.kb-scroll{overflow-x:auto}
.kb{position:relative;width:100%;min-width:640px;aspect-ratio:23/6.25;container-type:inline-size}
.k{--u:calc(100cqw / 23);position:absolute;padding:calc(var(--u)*.05)}
.cap{width:100%;height:100%;border-radius:calc(var(--u)*.14);background:var(--cap);color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--f-key);font-weight:600;font-size:calc(var(--u)*.26);line-height:1.05;box-shadow:inset 0 calc(var(--u)*-.13) 0 var(--cap-edge);padding-bottom:calc(var(--u)*.1);transition:transform .05s,background .15s;position:relative}
.k.dim .cap{background:var(--cap-dim);color:var(--dim-txt);font-size:calc(var(--u)*.22)}
.cap.g-esc{background:var(--g-esc);color:#fff}
.cap.g-left{background:var(--g-left);color:#fff}
.cap.g-space{background:var(--g-space);color:#fff}
.cap.g-edit{background:var(--g-edit);color:#fff}
.cap.g-arrow{background:var(--g-arrow);color:var(--ink)}
.k.sp .cap{box-shadow:inset 0 calc(var(--u)*-.13) 0 rgba(0,0,0,.25);font-size:calc(var(--u)*.3)}
.kb.hard .k.sp .cap{background:var(--cap-dim);color:var(--ink);box-shadow:inset 0 calc(var(--u)*-.13) 0 var(--cap-edge)}
.kb.hard .k .lbl{opacity:0}
.kb.hard .k.show .lbl{opacity:1}
.k.down .cap{transform:translateY(calc(var(--u)*.07));box-shadow:inset 0 calc(var(--u)*-.05) 0 rgba(0,0,0,.25)}
.k.glow .cap{outline:calc(var(--u)*.11) solid var(--hl);outline-offset:calc(var(--u)*.02);animation:pulse 1s ease-in-out infinite;z-index:2}
@keyframes pulse{50%{outline-color:#fff;outline-offset:calc(var(--u)*.09)}}
.k.ok .cap{background:var(--good)!important;color:#fff!important}
.k.no .cap{background:var(--bad)!important;color:#fff!important}
.k.show .cap{outline:calc(var(--u)*.12) solid #5BF08F;z-index:2;animation:pulse .5s ease-in-out infinite}
.k.sp.off .cap{background:var(--cap-dim);color:var(--dim-txt);box-shadow:inset 0 calc(var(--u)*-.13) 0 var(--cap-edge)}

.chip{display:inline-flex;align-items:center;font-family:var(--f-key);font-weight:600;color:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 10px;white-space:nowrap}
.chip.g-arrow{color:var(--ink)}
.bg-esc{background:var(--g-esc)} .bg-left{background:var(--g-left)} .bg-space{background:var(--g-space)} .bg-edit{background:var(--g-edit)} .bg-arrow{background:var(--g-arrow)}

.focus-pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:#fff;border:3px solid var(--hl);border-radius:999px;padding:10px 22px;font:700 16px var(--f-body);cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25);animation:bob 1.4s ease-in-out infinite;max-width:calc(100% - 32px)}
@keyframes bob{50%{transform:translate(-50%,-4px)}}

.hud{display:flex;gap:8px;flex-wrap:wrap}
.hud-item{background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:1px 12px;display:flex;align-items:center;gap:8px;box-shadow:3px 3px 0 var(--ink)}
.hud-l{font-size:12px;color:var(--ink-soft)}
.hud-item b{font-family:var(--f-key);font-size:20px;font-variant-numeric:tabular-nums}
.hud-item b.hud-lv{font-family:var(--f-body);font-weight:900;font-size:18px}

main{flex:1;min-height:0;display:flex;flex-direction:column}
main>[data-screen]{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
main>[data-screen="home"],main>[data-screen="result"]{overflow:auto;padding:0 6px 6px 0}

/* ---------- 首頁 ---------- */
.entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.entry{display:flex;flex-direction:column;background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);overflow:hidden}
.entry-band{height:64px;border-bottom:3px solid var(--ink);position:relative;display:flex;align-items:flex-end;padding:10px 14px}
.entry-band .num{font-family:var(--f-key);font-weight:600;font-size:15px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 9px}
.entry-band .deco{position:absolute;right:14px;top:12px;display:flex;gap:6px}
.entry-band .deco span{font-family:var(--f-key);font-weight:600;font-size:15px;background:#fff;border:2px solid var(--ink);border-radius:7px;padding:1px 8px;box-shadow:0 3px 0 var(--ink)}
.entry-body{padding:14px;display:flex;flex-direction:column;gap:10px;flex:1}
.entry-body h2{font-size:26px}
.entry.locked .entry-band,.entry.locked .entry-body h2{opacity:.45}
.lockmsg{font-size:14px;font-weight:900;color:var(--ink);background:var(--wash);border:2px dashed var(--ink-soft);border-radius:10px;padding:4px 10px}
.diffs{display:grid;gap:8px}
.diff{display:flex;justify-content:space-between;align-items:center;gap:10px;font:900 18px var(--f-body);border:3px solid var(--ink);border-radius:12px;background:var(--wash);padding:6px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);color:var(--ink);width:100%}
.diff:hover:not(:disabled){background:var(--hl)}
.diff:disabled{cursor:not-allowed;opacity:.6}
.diff small{display:block;font-size:13px;font-weight:700;color:var(--ink-soft);line-height:1.3}
.diff>span:first-child{text-align:left}
.diff .st{font-size:13px;font-weight:900;color:var(--ink-soft);white-space:nowrap}
.diff .st.ok{color:var(--good)}
.lv-r{display:grid;justify-items:end;line-height:1.2}
.stars{color:var(--gold);letter-spacing:1px;font-size:16px;white-space:nowrap}
.stars .off{color:var(--cap-dim)}
.lv-best{font-size:12px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.crown{font-style:normal;margin-right:4px}
.crown.grey{filter:grayscale(1);opacity:.45}
.tpanel{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.footnav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding-top:10px;border-top:3px dashed var(--cap-edge)}

/* ---------- 熱身、複習一下的打勾列 ---------- */
.checks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chk{border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:3px 4px;display:grid;justify-items:center;gap:0;min-width:0}
.chk .chip{font-size:14px;padding:0 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chk .mark{font-size:12px;font-weight:900;color:var(--cap-edge)}
.chk.done{background:#E3F7EC;border-color:var(--good)}
.chk.done .mark{color:var(--good)}
.chk.now{background:#FFF6CC;border-color:var(--gold)}
.chk .arr{font-family:var(--f-key);font-size:12px;letter-spacing:2px;color:var(--cap-edge)}
.chk .arr b{color:var(--good)}
.rv-done{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:6;font-size:20px;padding:10px 26px}

/* ---------- 電腦救援隊 ---------- */
.timer{position:relative;height:16px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--wash)}
.timer div{height:100%;width:100%;background:var(--good);transform-origin:right}
.timer div.warn{background:var(--g-arrow)}
.timer-zones{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink-soft);font-weight:700;padding:0 4px;margin-top:-6px;flex-wrap:wrap}
.go-cover{position:absolute;inset:8px;border-radius:8px;background:rgba(27,40,54,.82);z-index:8;display:grid;place-items:center;align-content:center;gap:12px;color:#fff;text-align:center;padding:16px}
.go-cover h2{font-size:34px}
.go-cover p{font-size:18px;font-weight:700}
.go-cover .r-btns{justify-content:center}
.count{font-family:var(--f-key);font-size:72px;font-weight:600;line-height:1}

/* ---------- 結算 ---------- */
.result{display:grid;gap:14px;justify-items:start}
.result h2{font-size:30px}
.r-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.trend{font-weight:900;font-size:18px;border:3px solid var(--ink);border-radius:999px;padding:2px 16px;background:var(--wash)}
.trend.best{background:var(--hl)}
.trend.up{background:#DDF5E7;color:#127A45}
.r-mid{display:flex;align-items:center;gap:8px 22px;flex-wrap:wrap}
.r-stars{font-size:44px;letter-spacing:4px;color:var(--gold);line-height:1}
.r-stars .off{color:var(--cap-dim)}
.r-score{font-family:var(--f-key);font-size:46px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.r-score small{font-family:var(--f-body);font-size:18px;font-weight:900;margin-left:4px}
.r-crown{display:flex;align-items:center;gap:8px;font-weight:900;border:3px solid var(--ink);border-radius:14px;padding:2px 14px 2px 8px;background:#FFF6CC}
.r-crown i{font-size:34px;font-style:normal;line-height:1.2}
.r-crown.grey{background:var(--wash)}
.r-crown.grey i{filter:grayscale(1);opacity:.45}
.r-stats{display:flex;gap:10px;flex-wrap:wrap}
.r-stats div{border:2px solid var(--ink);border-radius:10px;padding:4px 14px;background:var(--wash)}
.r-stats b{font-family:var(--f-key);font-size:22px;font-variant-numeric:tabular-nums;margin-left:6px}
.r-stats .fc{background:var(--hl);font-weight:900}
.missed{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.missed .chip{font-size:18px;padding:2px 12px}
.r-btns{display:flex;gap:10px;flex-wrap:wrap}
.unlock-note{background:var(--hl);border:3px solid var(--ink);border-radius:12px;padding:6px 14px;font-weight:900}
.unlock-note.tip{background:var(--wash)}
.hist{width:100%;max-width:600px;display:grid;gap:6px}
.hist-row{display:grid;grid-template-columns:4.5em 1fr 5.5em 5.5em;gap:8px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.hist-row .bar{height:16px;border-radius:6px;background:var(--cap-dim);overflow:hidden}
.hist-row .bar i{display:block;height:100%;background:var(--g-left);border-radius:6px}
.hist-row.best .bar i{background:var(--gold)}
.hist-row.now{font-weight:900}
.hist-row.now .bar i{background:var(--g-edit)}
.hist-row span:nth-child(3),.hist-row span:nth-child(4){text-align:right}
.hist-row .hs{color:var(--gold);letter-spacing:-1px}
.hist-head{color:var(--ink-soft);font-size:12px}

/* ---------- 逐級解鎖、皇冠、示範 ---------- */
.diff .lk{font-size:12px;font-weight:700;color:var(--ink-soft)}
.crowns{display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap;border:2px dashed var(--gold);border-radius:12px;padding:4px 10px;background:#FFF9DB;font-size:14px;font-weight:900}
.crowns i{font-style:normal;font-size:22px}
.crowns i.off{filter:grayscale(1);opacity:.3}
.crowns b{color:var(--mid)}
.ver.demo{background:var(--g-esc);color:#fff}
.demo-bar{grid-column:1/-1;background:var(--g-esc);color:#fff;font-weight:900;border:3px solid var(--ink);border-radius:12px;padding:6px 14px}

/* ---------- 病毒入侵 ---------- */
#vScene{flex:1;min-height:0}
.vlayer{position:absolute;inset:8px 8px 42px;pointer-events:none;z-index:5;overflow:hidden;border-radius:8px}
.vlayer.hit{animation:infect .45s ease-out}
@keyframes infect{0%{background:rgba(229,72,77,.55)}100%{background:transparent}}
.virus{position:absolute;width:clamp(70px,13vh,120px);transform:translate(-50%,-50%);filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.virus.walk{animation:wobble .5s ease-in-out infinite alternate}
@keyframes wobble{to{rotate:8deg}}
.virus.die{transition:transform .3s,opacity .3s!important;transform:translate(-50%,-50%) scale(.1) rotate(180deg)!important;opacity:0}
.virus.grab{transition:transform .3s!important;transform:translate(-50%,-50%) scale(1.6)!important}
.hearts{font-size:20px;letter-spacing:2px;color:var(--bad)}
.hearts .off{color:var(--cap-dim)}
#vBar{height:100%;width:100%;background:#8B5CF6;transform-origin:right}
#vBar.warn{background:var(--bad)}

/* 速度關卡的背景：第 1 關藍天 → 2 黃昏 → 3 紫色警報 → 4 紅色危險（邊框閃） → 5 黑色程式碼 */
[data-screen=virus] .monitor .desk{transition:background .6s}
[data-screen=virus] .monitor[data-stage="2"] .desk{background:linear-gradient(160deg,#F59E42,#FBD38D)}
[data-screen=virus] .monitor[data-stage="3"] .desk{background:linear-gradient(160deg,#6D28D9,#C4B5FD)}
[data-screen=virus] .monitor[data-stage="4"] .desk{background:linear-gradient(160deg,#B91C1C,#F87171)}
[data-screen=virus] .monitor[data-stage="4"]{animation:alarm 1s ease-in-out infinite}
@keyframes alarm{50%{box-shadow:5px 5px 0 var(--ink),0 0 0 6px rgba(229,72,77,.7)}}
[data-screen=virus] .monitor[data-stage="5"] .desk{background:#0B1220 repeating-linear-gradient(0deg,rgba(91,240,122,.12) 0 2px,transparent 2px 22px)}
[data-screen=virus] .monitor[data-stage="5"]{animation:alarm .6s ease-in-out infinite}
[data-screen=virus] .monitor[data-stage="5"] .desk::before{content:"01001 110 0101 1 0011 01 10110 0 1101 01";position:absolute;inset:0;color:rgba(91,240,122,.35);font:700 22px monospace;letter-spacing:.6em;line-height:2.2;word-break:break-all;animation:rain 3s linear infinite;pointer-events:none}
@keyframes rain{from{transform:translateY(-30%)}to{transform:translateY(10%)}}
.vstage{position:absolute;left:18px;top:16px;z-index:6;background:rgba(27,40,54,.85);color:#fff;border:2px solid #fff;border-radius:999px;padding:2px 14px;font-weight:900;font-size:15px}
.vstage-big{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:9;font-family:var(--f-display);font-size:clamp(28px,6vh,48px);font-weight:700;color:#fff;background:var(--ink);border:4px solid var(--hl);border-radius:20px;padding:4px 26px;white-space:nowrap;opacity:0;pointer-events:none}
.vstage-big.go{animation:stagein 1.3s ease-out forwards}
@keyframes stagein{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
.virus{display:grid;justify-items:center}
.virus img{width:100%;display:block}
.virus .vtag{font-size:clamp(14px,2.4vh,20px);margin-top:-6px;padding:0 10px;box-shadow:0 3px 0 var(--ink)}

/* ---------- 證書 ---------- */
.cert-wrap{position:fixed;inset:0;z-index:30;background:rgba(27,40,54,.6);display:grid;place-items:center;padding:16px;overflow:auto}
.cert{width:min(680px,100%);background:#FFFDF4;border:4px solid var(--ink);border-radius:18px;box-shadow:8px 8px 0 var(--ink);padding:14px;animation:popcert .4s ease-out}
@keyframes popcert{from{transform:scale(.7);opacity:0}}
.cert-in{position:relative;border:6px double var(--gold);border-radius:10px;padding:18px 22px 22px;text-align:center;background:
  radial-gradient(circle at 0 0,#FFE9A8 0 40px,transparent 41px),radial-gradient(circle at 100% 0,#FFE9A8 0 40px,transparent 41px),
  radial-gradient(circle at 0 100%,#FFE9A8 0 40px,transparent 41px),radial-gradient(circle at 100% 100%,#FFE9A8 0 40px,transparent 41px)}
.cert-kicker{font-weight:900;color:var(--ink-soft);letter-spacing:.3em}
.cert-title{font-size:clamp(34px,7vh,52px);letter-spacing:.12em;color:var(--mid)}
.cert-sub{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.5em;margin-bottom:8px}
.cert-body{font-size:18px;line-height:1.9;font-weight:700}
.cert-seat{width:3.2em;font:900 20px var(--f-key);text-align:center;border:none;border-bottom:3px solid var(--ink);background:transparent;color:var(--ink)}
.cert-seat:focus{outline:none;background:#FFF2B8}
.cert-name{font-family:var(--f-display);font-size:30px;font-weight:700;margin:6px 0}
.cert-crowns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0}
.cert-crowns div{border:2px solid var(--ink);border-radius:12px;padding:2px 12px;background:#fff;font-weight:900;font-size:14px}
.cert-crowns i{font-style:normal;font-size:24px;display:block;line-height:1.2}
.cert-date{color:var(--ink-soft);font-weight:700;margin-top:6px}
.cert-seal{position:absolute;right:18px;bottom:16px;width:76px;height:76px;border-radius:50%;border:4px solid var(--bad);color:var(--bad);display:grid;place-items:center;font-weight:900;font-size:15px;line-height:1.2;transform:rotate(-12deg);background:rgba(255,255,255,.6)}
.cert-btns{justify-content:center;margin-top:12px}
@media print{ body>*:not(.cert-wrap){display:none!important} .cert-wrap{position:static;background:none} .cert-btns{display:none} }

@media (max-width:720px){ html,body{height:auto} .wrap{height:auto} .brand h1{font-size:22px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>

<script>
/* ===== 共用：按鍵資料、鍵盤、聲音、情境畫面 ===== */
const $ = s => document.querySelector(s);
const H = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

const K = {
  esc:  {codes:['Escape'], key:'Esc', use:'關閉視窗', group:'esc'},
  tab:  {codes:['Tab'], key:'Tab', use:'跳到下一格', group:'left'},
  caps: {codes:['CapsLock'], key:'Caps Lock', use:'大寫鎖定', group:'left'},
  shift:{codes:['ShiftLeft','ShiftRight'], key:'Shift', use:'切換中／英', group:'left'},
  space:{codes:['Space'], key:'空白鍵', use:'空一格', group:'space'},
  enter:{codes:['Enter','NumpadEnter'], key:'Enter', use:'確定、換行', group:'edit'},
  bksp: {codes:['Backspace'], key:'Backspace', use:'刪除左邊的字', group:'edit'},
  del:  {codes:['Delete'], key:'Delete', use:'刪除右邊的字', group:'edit'},
  up:   {codes:['ArrowUp'], key:'↑', use:'往上移', group:'arrow'},
  down: {codes:['ArrowDown'], key:'↓', use:'往下移', group:'arrow'},
  left: {codes:['ArrowLeft'], key:'←', use:'往左移', group:'arrow'},
  right:{codes:['ArrowRight'], key:'→', use:'往右移', group:'arrow'},
};
const ARROWS = ['up','down','left','right'];
const TOPICS = ['esc','tab','caps','shift','space','enter','bksp','del','arrow'];
const topicOf = id => ARROWS.includes(id) ? 'arrow' : id;
const TOPIC = {};
TOPICS.forEach(t => TOPIC[t] = t==='arrow' ? {key:'方向鍵', use:'移動游標', group:'arrow', codes:['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']} : K[t]);
const CODE2K = {};
Object.keys(K).forEach(id => K[id].codes.forEach(c => CODE2K[c] = id));

/* ---------- 全尺寸鍵盤 ---------- */
function buildKeyboard(el){
  const L = [];
  const k = (code,label,x,y,w,h) => L.push({code,label,x,y,w:w||1,h:h||1});
  k('Escape','Esc',0,0);
  for (let i=1;i<=12;i++){ const x = i<=4 ? 1+i : i<=8 ? 1.5+i : 2+i; k('F'+i,'F'+i,x,0); }
  k('PrintScreen','PrtSc',15.5,0); k('ScrollLock','ScrLk',16.5,0); k('Pause','Pause',17.5,0);
  ['Backquote:`','Digit1:1','Digit2:2','Digit3:3','Digit4:4','Digit5:5','Digit6:6','Digit7:7','Digit8:8','Digit9:9','Digit0:0','Minus:-','Equal:='].forEach((s,i)=>{ const p=s.split(':'); k(p[0],p[1],i,1.25); });
  k('Backspace','← Backspace',13,1.25,2);
  k('Insert','Ins',15.5,1.25); k('Home','Home',16.5,1.25); k('PageUp','PgUp',17.5,1.25);
  k('NumLock','Num',19,1.25); k('NumpadDivide','/',20,1.25); k('NumpadMultiply','*',21,1.25); k('NumpadSubtract','-',22,1.25);
  k('Tab','Tab ⇥',0,2.25,1.5);
  'QWERTYUIOP'.split('').forEach((l,i)=>k('Key'+l,l,1.5+i,2.25));
  k('BracketLeft','[',11.5,2.25); k('BracketRight',']',12.5,2.25); k('Backslash','\\',13.5,2.25,1.5);
  k('Delete','Delete',15.5,2.25); k('End','End',16.5,2.25); k('PageDown','PgDn',17.5,2.25);
  k('Numpad7','7',19,2.25); k('Numpad8','8',20,2.25); k('Numpad9','9',21,2.25); k('NumpadAdd','+',22,2.25,1,2);
  k('CapsLock','Caps<br>Lock',0,3.25,1.75);
  'ASDFGHJKL'.split('').forEach((l,i)=>k('Key'+l,l,1.75+i,3.25));
  k('Semicolon',';',10.75,3.25); k('Quote',"'",11.75,3.25); k('Enter','Enter ↵',12.75,3.25,2.25);
  k('Numpad4','4',19,3.25); k('Numpad5','5',20,3.25); k('Numpad6','6',21,3.25);
  k('ShiftLeft','⇧ Shift',0,4.25,2.25);
  'ZXCVBNM'.split('').forEach((l,i)=>k('Key'+l,l,2.25+i,4.25));
  k('Comma',',',9.25,4.25); k('Period','.',10.25,4.25); k('Slash','/',11.25,4.25); k('ShiftRight','⇧ Shift',12.25,4.25,2.75);
  k('ArrowUp','↑',16.5,4.25);
  k('Numpad1','1',19,4.25); k('Numpad2','2',20,4.25); k('Numpad3','3',21,4.25); k('NumpadEnter','Ent',22,4.25,1,2);
  k('ControlLeft','Ctrl',0,5.25,1.25); k('MetaLeft','Win',1.25,5.25,1.25); k('AltLeft','Alt',2.5,5.25,1.25);
  k('Space','空白鍵',3.75,5.25,6.25);
  k('AltRight','Alt',10,5.25,1.25); k('MetaRight','Win',11.25,5.25,1.25); k('ContextMenu','Menu',12.5,5.25,1.25); k('ControlRight','Ctrl',13.75,5.25,1.25);
  k('ArrowLeft','←',15.5,5.25); k('ArrowDown','↓',16.5,5.25); k('ArrowRight','→',17.5,5.25);
  k('Numpad0','0',19,5.25,2); k('NumpadDecimal','.',21,5.25);

  L.forEach(o => {
    const d = document.createElement('div');
    d.className = 'k'; d.dataset.code = o.code;
    d.style.left = (o.x/23*100)+'%'; d.style.top = (o.y/6.25*100)+'%';
    d.style.width = (o.w/23*100)+'%'; d.style.height = (o.h/6.25*100)+'%';
    const id = o.code==='NumpadEnter' ? null : CODE2K[o.code];
    const cap = document.createElement('div'); cap.className = 'cap';
    if (id){ d.classList.add('sp'); cap.classList.add('g-'+K[id].group); } else d.classList.add('dim');
    cap.innerHTML = '<span class="lbl">'+o.label+'</span>';
    d.appendChild(cap); el.appendChild(d);
  });
  const els = code => el.querySelectorAll('[data-code="'+code+'"]');
  return {
    els,
    clear(){ el.querySelectorAll('.k').forEach(x => x.classList.remove('glow','ok','no','show')); },
    glow(codes){ el.querySelectorAll('.glow').forEach(x=>x.classList.remove('glow')); (codes||[]).forEach(c => els(c).forEach(x=>x.classList.add('glow'))); },
    flash(codes,cls,ms){ codes.forEach(c => els(c).forEach(x => { x.classList.add(cls); setTimeout(()=>x.classList.remove(cls), ms||500); })); },
    hard(on){ el.classList.toggle('hard', !!on); },
    down(code){ els(code).forEach(x=>x.classList.add('down')); },
    up(code){ els(code).forEach(x=>x.classList.remove('down')); },
    upAll(){ el.querySelectorAll('.down').forEach(x=>x.classList.remove('down')); }
  };
}

/* ---------- 儲存（只存在這台電腦的瀏覽器；還原系統重開機後自動清空） ---------- */
/* 用 localStorage：重新整理、關掉瀏覽器再打開，紀錄都還在；學生電腦還原後自動清空。
   不會還原的電腦（例如老師電腦），派發前由老師按一次「清除這台電腦的紀錄」（規格書 2.2） */
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- 聲音 ---------- */
const Sound = {
  ac:null, muted:false,
  init(){ if (!this.ac){ try{ this.ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if (this.ac && this.ac.state==='suspended') this.ac.resume(); },
  tone(f,d,type,when,vol){
    const ac = this.ac; if (!ac || this.muted) return;
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime+(when||0);
    o.type = type||'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(vol||.14,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.03);
  },
  good(){ this.tone(660,.12,'triangle'); this.tone(990,.2,'triangle',.08); },
  mid(){ this.tone(560,.14,'triangle'); },
  bad(){ this.tone(170,.25,'square',0,.07); },
  tick(){ this.tone(520,.06,'sine',0,.08); },
  win(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,.22,'triangle',i*.11)); },
  soft(){ [392,440,523].forEach((f,i)=>this.tone(f,.22,'triangle',i*.12,.08)); }
};
$('#soundBtn').addEventListener('click', () => { Sound.init(); Sound.muted = !Sound.muted; $('#soundBtn').textContent = Sound.muted ? '聲音：關' : '聲音：開'; });

/* ---------- 鍵盤事件 ---------- */
function listenKeys(kb, onPress){
  let capsDown = false;
  document.addEventListener('keydown', e => {
    if (e.target && e.target.tagName==='INPUT') return;   /* 證書上寫座號時，正常打字 */
    Sound.init();
    const pass = ['F5','F11','F12'].includes(e.code) || ((e.ctrlKey||e.metaKey) && e.code==='KeyR');
    if (!pass) e.preventDefault();
    if (e.repeat) return;
    kb.down(e.code);
    if (e.code==='CapsLock') capsDown = true;
    onPress(e.code, e);
  });
  document.addEventListener('keyup', e => {
    if (e.code.indexOf('Alt')===0 || e.code==='Space') e.preventDefault();
    kb.up(e.code);
    if (e.code==='CapsLock'){ if (!capsDown) onPress('CapsLock', e); capsDown = false; }
  });
}

/* ---------- 焦點提示 ---------- */
function setupFocus(pill, hooks){
  const off = () => { pill.hidden = false; pill.textContent = hooks.pausedText ? hooks.pausedText() : '點一下這裡，讓鍵盤連上畫面'; hooks.blur && hooks.blur(); };
  const on = () => { pill.hidden = true; hooks.focus && hooks.focus(); };
  window.addEventListener('blur', off);
  window.addEventListener('focus', on);
  pill.addEventListener('click', () => { window.focus(); on(); });
  setTimeout(() => { if (!document.hasFocus()) off(); }, 600);
}

const POPUPS = ['恭喜中獎！','下載免費遊戲？','你的電腦要更新','點我領寶物！','有新訊息！'];
const DIALOGS = ['要存檔嗎？','要送出作業嗎？','要開始遊戲嗎？','要列印嗎？'];
function blankState(){
  return {view:'doc', title:'記事本', lines:[''], r:0, c:0, caps:false, ime:'中',
    popup:null, popupOut:false, respawn:false, dialog:null, dialogOut:false, okPress:false,
    form:null, sample:'apple', red:null, star:null, gap:null, wantCase:null, wantIme:null,
    okPulse:false, nextBlink:false, imeBlink:false, capsBlink:false};
}
class Scene{
  constructor(el){ this.el = el; this.S = blankState(); this.timers = []; }
  load(s){ this.clearTimers(); this.S = Object.assign(blankState(), s); this.render(); }
  clearTimers(){ this.timers.forEach(clearTimeout); this.timers = []; }
  later(fn,ms){ this.timers.push(setTimeout(fn,ms)); }
  line(){ return this.S.lines[this.S.r]; }
  ins(str){ const S=this.S, l=this.line(); S.lines[S.r] = l.slice(0,S.c)+str+l.slice(S.c); S.c += str.length; }
  clearMarks(){ const S=this.S; S.red=S.star=S.gap=S.wantCase=S.wantIme=null; S.okPulse=S.nextBlink=S.imeBlink=S.capsBlink=false; }
  apply(id){
    const S = this.S; this.clearMarks();
    const doc = S.view==='doc';
    switch(id){
      case 'esc':
        if (S.popup && !S.popupOut){
          S.popupOut = true;
          this.later(() => { S.popup=null; S.popupOut=false; this.render();
            if (S.respawn) this.later(() => { S.popup = rnd(POPUPS); this.render(); }, 1800); }, 280);
        } else if (S.dialog && !S.dialogOut){
          S.dialogOut = true; this.later(() => { S.dialog=null; S.dialogOut=false; this.render(); }, 280);
        }
        break;
      case 'enter':
        if (S.dialog && !S.dialogOut){
          S.okPress = true; S.dialogOut = true;
          this.later(() => { S.dialog=null; S.dialogOut=false; S.okPress=false; this.render();
            if (S.respawn) this.later(() => { S.dialog = rnd(DIALOGS); this.render(); }, 1800); }, 380);
        } else if (doc){ const l=this.line(); S.lines.splice(S.r,1,l.slice(0,S.c),l.slice(S.c)); S.r++; S.c=0; }
        break;
      case 'tab':
        if (S.view==='form') S.form.f = (S.form.f+1) % S.form.fields.length;
        else if (doc) this.ins('    ');
        break;
      case 'caps': S.caps = !S.caps; break;
      case 'shift': S.ime = S.ime==='中' ? '英' : '中'; break;
      case 'space': if (doc) this.ins(' '); break;
      case 'bksp':
        if (doc){
          if (S.c>0){ const l=this.line(); S.lines[S.r]=l.slice(0,S.c-1)+l.slice(S.c); S.c--; }
          else if (S.r>0){ const prev=S.lines[S.r-1]; S.lines.splice(S.r-1,2,prev+this.line()); S.r--; S.c=prev.length; }
        } else if (S.view==='form'){ const f=S.form.fields[S.form.f]; f[1]=f[1].slice(0,-1); }
        break;
      case 'del':
        if (doc){
          const l=this.line();
          if (S.c<l.length) S.lines[S.r]=l.slice(0,S.c)+l.slice(S.c+1);
          else if (S.r<S.lines.length-1) S.lines.splice(S.r,2,l+S.lines[S.r+1]);
        }
        break;
      case 'left': if (doc){ if (S.c>0) S.c--; else if (S.r>0){ S.r--; S.c=this.line().length; } } break;
      case 'right': if (doc){ if (S.c<this.line().length) S.c++; else if (S.r<S.lines.length-1){ S.r++; S.c=0; } } break;
      case 'up': if (doc && S.r>0){ S.r--; S.c=Math.min(S.c,this.line().length); } break;
      case 'down': if (doc && S.r<S.lines.length-1){ S.r++; S.c=Math.min(S.c,this.line().length); } break;
    }
    this.render();
  }
  render(){
    const S = this.S; let body = '';
    if (S.view==='doc'){
      body = '<div class="doc">' + S.lines.map((ln,row) => {
        let h = '';
        for (let i=0;i<=ln.length;i++){
          if (S.star && S.star[0]===row && S.star[1]===i) h += '<i class="m-star"></i>';
          if (S.gap && S.gap[0]===row && S.gap[1]===i) h += '<i class="m-gap"></i>';
          if (row===S.r && i===S.c) h += '<i class="caret"></i>';
          if (i<ln.length){ const ch = H(ln[i]); h += (S.red && S.red[0]===row && S.red[1]===i) ? `<span class="m-red">${ch}</span>` : ch; }
        }
        return `<div class="ln">${h}</div>`;
      }).join('') + '</div>';
    } else if (S.view==='form'){
      const n = S.form.fields.length;
      body = S.form.fields.map((f,i) => `<div class="frow"><span>${f[0]}</span><div class="fld ${i===S.form.f?'on':''} ${S.nextBlink && i===(S.form.f+1)%n ? 'next':''}">${H(f[1])}${i===S.form.f?'<i class="caret"></i>':''}</div></div>`).join('');
    } else if (S.view==='caps'){
      const show = S.caps ? S.sample.toUpperCase() : S.sample.toLowerCase();
      body = `<div class="big-demo"><div class="lampbig ${S.caps?'on':''} ${S.capsBlink?'blinkbg':''}"></div><div class="sample">${show}</div>${S.wantCase ? `<span class="arrowto">➜</span><div class="sample ghost">${S.wantCase==='up'?S.sample.toUpperCase():S.sample.toLowerCase()}</div>` : ''}</div>`;
    } else if (S.view==='ime'){
      const zh = S.ime==='中';
      const imeBox = (v,ghost) => `<div class="imebig ${v==='中'?'zh':'en'} ${ghost?'ghost':''} ${!ghost && S.imeBlink?'blinkbg':''}">${v}</div>`;
      body = `<div class="big-demo">${imeBox(S.ime)}<div class="sample ${zh?'zh':''}">${zh?'ㄋㄧˇ ㄏㄠˇ':'hello'}</div>${S.wantIme ? `<span class="arrowto">➜</span>${imeBox(S.wantIme,true)}` : ''}</div>`;
    }
    const pop = S.popup ? `<div class="pop ${S.popupOut?'out':''}"><div class="pop-bar"><span>通知</span><span>✕</span></div><p>${H(S.popup)}</p></div>` : '';
    const dlg = S.dialog ? `<div class="pop dlg ${S.dialogOut?'out':''}"><div class="pop-bar"><span>確認</span><span>✕</span></div><p>${H(S.dialog)}</p><div class="dlg-btns"><span class="okb ${S.okPulse?'pulse':''} ${S.okPress?'press':''}">確定</span><span>取消</span></div></div>` : '';
    this.el.innerHTML = `<div class="desk">
      <div class="win"><div class="win-bar"><span>${H(S.title)}</span><span class="ctl">─□✕</span></div><div class="win-body">${body}</div>${pop}${dlg}</div>
      <div class="taskbar"><span class="tb-start"><i></i><i></i><i></i><i></i></span>
        <span class="tb-right"><span class="tb-lamp"><i class="${S.caps?'on':''}"></i>大寫燈</span><span class="tb-ime ${S.imeBlink?'blinkbg':''}">${S.ime}</span></span></div>
    </div>`;
  }
}

    default: {

/* 出題：每顆鍵至少出現一次，其餘依「錯題權重」抽；權重越高越常出現，相鄰不重複 */
const wOf = t => Math.min(WEIGHT.max, P.weight[t] || WEIGHT.base);
function buildQueue(n, pool){
  let q = shuffle(pool.slice()).slice(0, Math.min(n, pool.length));
  while (q.length < n){
    const tot = pool.reduce((s,t) => s + wOf(t), 0);
    let r = Math.random()*tot, pick = pool[pool.length-1];
    for (const t of pool){ r -= wOf(t); if (r < 0){ pick = t; break; } }
    q.push(pick);
  }
  q = shuffle(q);
  for (let i=1;i<q.length;i++) if (q[i]===q[i-1]){
    const j = q.findIndex((t,x) => x>i && t!==q[i] && q[x-1]!==q[i] && (x+1>=q.length || q[x+1]!==q[i]));
    if (j>0) [q[i],q[j]] = [q[j],q[i]];
  }
  return q.map(t => t==='arrow' ? rnd(ARROWS) : t);
}
/* 依這一題的表現調整權重：不可＋2、可（或比自己平均慢很多）＋1、又快又對就慢慢降回原值 */
function learn(t, judge, rt){
  const avg = P.rtN >= WEIGHT.minSamples ? P.rtSum/P.rtN : null;
  let w = P.weight[t] || WEIGHT.base, slow = false;
  if (judge==='bad') w += WEIGHT.bad;
  else if (judge==='ok' || (avg && rt > avg*WEIGHT.slowRatio)){ w += WEIGHT.slow; slow = true; }
  else w = Math.max(WEIGHT.base, w - WEIGHT.recover);
  P.weight[t] = Math.min(WEIGHT.max, w);
  if (rt!=null){ P.rtSum += rt; P.rtN++; }
  save();
  return slow;
}

function updHud(){ $('#score').textContent = G.score; $('#combo').textContent = G.combo; }
const scoreOf = g => Math.round((g.good + g.ok*0.5) / g.q.length * 100);
function startGame(li){
  stopAll();
  const lv = LEVELS[li], topics = GAME.topics, n = nOf(lv);
  G = {li, lv, key:gk(li), topics, q:buildQueue(n, topics), i:0, score:0, good:0, ok:0, bad:0,
       combo:0, maxCombo:0, rts:[], weak:new Set(), locked:true, over:false};
  show('game');
  kbFocus(topics); kb.hard(lv.scaffold==='none');
  $('#lvV').textContent = lv.name;
  updHud(); $('#prog').textContent = `0/${n}`;
  gScene.load({lines:[''], c:0}); $('#gAsk').hidden = true;
  const bar = $('#timerBar'); bar.style.transform = 'scaleX(1)'; bar.className = '';
  $('#timerWrap').hidden = !lv.limit;
  $('#zones').innerHTML = lv.limit
    ? `<span>「良」${lv.good} 秒內</span><span>「可」${lv.limit} 秒內</span><span>超過 ${lv.limit} 秒或按錯＝「不可」</span>`
    : `<span>「良」${lv.good} 秒內</span><span>慢一點也沒關係＝「可」</span><span>按錯鍵＝「不可」</span>`;
  const g = G;
  countdown($('#gCover'), `${GAME.name}・${lv.name}`, SCAFFOLD_TEXT[lv.scaffold], () => { if (G===g) nextQ(); });
}
function nextQ(){
  if (!G || G.over) return;
  if (G.i >= G.q.length) return endGame();
  const id = G.q[G.i]; G.id = id;
  gScene.load(situation(id));
  kb.clear(); renderAsk($('#gAsk'), id, G.lv.scaffold);
  if (G.lv.scaffold==='glow') kb.glow(codesOf(id));
  G.start = performance.now();
  G.deadline = G.lv.limit ? G.start + G.lv.limit*1000 : Infinity;
  G.locked = false;
  $('#prog').textContent = `${G.i+1}/${G.q.length}`;
  if (G.lv.limit){ $('#timerBar').style.transform = 'scaleX(1)'; $('#timerBar').className = ''; }
  cancelAnimationFrame(loop); loop = requestAnimationFrame(tick);
}
function tick(now){
  if (!G || G.over || screen!=='game') return;
  if (!G.locked && paused==null && G.lv.limit){
    const total = G.lv.limit*1000, rem = Math.max(0, G.deadline-now), used = (total-rem)/1000;
    const bar = $('#timerBar');
    bar.style.transform = `scaleX(${rem/total})`;
    bar.className = used <= G.lv.good ? '' : 'warn';
    if (rem <= 0) miss(null);
  }
  loop = requestAnimationFrame(tick);
}
function gamePress(code){
  if (!G || G.locked) return;
  if (CODE2K[code]===G.id) hit(code); else miss(code);
}
function hit(code){
  G.locked = true;
  const rt = (performance.now() - G.start) / 1000;
  const judge = rt <= G.lv.good ? 'good' : 'ok';
  G[judge]++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); G.rts.push(rt);
  const t = topicOf(G.id);
  if (learn(t, judge, rt)) G.weak.add(t);
  G.score = scoreOf(G);
  gScene.apply(G.id);
  kb.glow([]); kb.flash([code],'ok',500);
  if (judge==='good'){ Sound.good(); fx($('#gFx'),'good','良！'); } else { Sound.mid(); fx($('#gFx'),'mid','可'); }
  updHud();
  const g = G;
  setTimeout(() => { if (G===g){ G.i++; nextQ(); } }, 750);
}
function miss(code){
  if (!G || G.locked) return;
  G.locked = true; G.bad++; G.combo = 0;
  const t = topicOf(G.id); G.weak.add(t); learn(t, 'bad', null);
  if (code) kb.flash([code],'no',600);
  kb.glow([]);
  codesOf(G.id).forEach(c => kb.els(c).forEach(x => x.classList.add('show')));
  Sound.bad(); fx($('#gFx'), 'no', code ? '不可' : '時間到・不可'); updHud();
  $('#timerBar').style.transform = 'scaleX(0)';
  const g = G;
  setTimeout(() => { if (G===g){ kb.clear(); G.i++; nextQ(); } }, 1300);
}

/* ---------- 結算：只和自己比 ---------- */
function endGame(){
  const g = G; G = null;
  const score = scoreOf(g), stars = starsOf(score), key = g.key;
  const hist = P.history[key] = P.history[key] || [];
  const prev = hist.length ? hist[hist.length-1].score : null;
  const bestBefore = hist.length ? Math.max(...hist.map(h => h.score)) : null;
  const d = new Date();
  hist.push({score, stars, at:`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`});
  while (hist.length > HISTORY_MAX) hist.shift();

  /* 進步符號：只和同一難度的自己比；比上次低時不顯示負面符號 */
  let trend;
  if (prev==null) trend = {cls:'first', text:'🚀 第一次挑戰！'};
  else if (score > bestBefore) trend = {cls:'best', text:'👍 新紀錄！'};
  else if (score > prev) trend = {cls:'up', text:'⬆ 比上一次進步了！'};
  else if (prev - score <= TREND_FLAT) trend = {cls:'flat', text:'💪 穩住了！'};
  else trend = {cls:'again', text:'🔁 再挑戰一次？'};

  /* 皇冠：100 分得到；之後每次 90 分以上保持；低於 90 變灰，再拿 90 分以上就回來 */
  const had = P.crown[key]; let crown = null;
  if (score >= CROWN.full){ P.crown[key] = 'gold'; crown = {grey:false, text: had==='gold' ? '皇冠保持住了！' : had==='grey' ? '皇冠回來了！' : '得到皇冠！'}; }
  else if (had){
    if (score >= CROWN.keep){ P.crown[key] = 'gold'; crown = {grey:false, text: had==='grey' ? '皇冠回來了！' : '皇冠保持住了！'}; }
    else { P.crown[key] = 'grey'; crown = {grey:true, text:`皇冠先休息一下，再拿 ${CROWN.keep} 分以上就回來`}; }
  }
  const hasNext = g.li+1 < LEVELS.length;
  const wasOpen = hasNext && levelOpen(g.li+1), miniWas = modeOpen('mini');
  P.stars[key] = Math.max(P.stars[key]||0, stars);
  if (P.best[key]==null || score > P.best[key]) P.best[key] = score;
  const nowOpen = hasNext && levelOpen(g.li+1);
  /* 四頂皇冠同時是金色 → 成為「鍵盤小勇士」（稱號拿到就保留） */
  let newTitle = false;
  if (!P.title && crownCount()===LEVELS.length){ P.title = {at: todayStr()}; newTitle = true; }
  save();
  stars ? Sound.win() : Sound.soft();

  show('result');
  $('#rTitle').textContent = `${GAME.name}・${g.lv.name}`;
  $('#rTrend').className = 'trend ' + trend.cls; $('#rTrend').textContent = trend.text;
  $('#rStars').innerHTML = starStr(stars);
  $('#rScore').innerHTML = `${score}<small>分</small>`;
  const rc = $('#rCrown'); rc.hidden = !crown;
  if (crown){ rc.className = 'r-crown' + (crown.grey ? ' grey' : ''); rc.innerHTML = `<i>👑</i>${H(crown.text)}`; }
  const avg = g.rts.length ? g.rts.reduce((a,b)=>a+b,0)/g.rts.length : 0;
  $('#rStats').innerHTML = [['良',g.good],['可',g.ok],['不可',g.bad],['最多連段',g.maxCombo],['平均反應',avg?avg.toFixed(1)+' 秒':'—']]
    .map(s => `<div>${s[0]}<b>${s[1]}</b></div>`).join('') + (g.bad===0 ? '<div class="fc">全連段！</div>' : '');
  /* 解鎖提示：剛打開下一級，或還差多少 */
  const un = $('#rUnlock');
  const isBoss = g.li===LEVELS.length-1, virusNew = isBoss && crown && !crown.grey && !had, miniNew = !miniWas && modeOpen('mini');
  const opened = [hasNext && !wasOpen && nowOpen ? LEVELS[g.li+1].name : null, miniNew ? VIRUS_MODES.mini.name : null, virusNew ? VIRUS_MODES.crisis.name : null].filter(Boolean);
  if (opened.length){ un.hidden = false; un.className = 'unlock-note'; un.textContent = opened.map(x=>`「${x}」`).join('和') + '打開了！'; }
  else if (hasNext && !wasOpen && nowOpen){ un.hidden = false; un.className = 'unlock-note'; un.textContent = `「${LEVELS[g.li+1].name}」打開了！`; }
  else if (hasNext && !nowOpen){ un.hidden = false; un.className = 'unlock-note tip'; un.textContent = `拿到 ${GATE[g.li+1]} 顆星（${STAR_AT[GATE[g.li+1]-1]} 分以上），就能挑戰「${LEVELS[g.li+1].name}」`; }
  else if (!P.title && crownCount() < LEVELS.length){ un.hidden = false; un.className = 'unlock-note tip'; un.textContent = `皇冠 ${crownCount()}/${LEVELS.length}：每一級都拿到 100 分，就能成為「鍵盤小勇士」`; }
  else un.hidden = true;
  $('#rMissed').innerHTML = g.weak.size ? `<b>這一輪可以多練：</b>${[...g.weak].map(chipOf).join('')}` : '<b>每一顆都又快又對，太厲害了！</b>';
  const heavy = g.topics.filter(t => wOf(t) > WEIGHT.base).sort((a,b) => wOf(b)-wOf(a)).slice(0,2);
  $('#rWeak').hidden = !heavy.length;
  $('#rWeak').innerHTML = heavy.length ? `<b>下一輪會多出現：</b>${heavy.map(chipOf).join('')}` : '';
  const best = Math.max(...hist.map(h => h.score)), last = hist.length-1;
  $('#rHist').innerHTML = `<b>這節課「${g.lv.name}」的紀錄</b>
    <div class="hist-row hist-head"><span>時間</span><span></span><span>分數</span><span>星星</span></div>` +
    hist.map((h,i) => `<div class="hist-row ${i===last?'now':''} ${h.score===best?'best':''}"><span>${i===last?'這次':h.at}</span><span class="bar"><i style="width:${h.score}%"></i></span><span>${h.score===best?'🏅 ':''}${h.score}</span><span class="hs">${'★'.repeat(h.stars)||'—'}</span></div>`).join('');
  $('#rAgain').onclick = () => startGame(g.li);
  const rn = $('#rNext');
  if (isBoss && modeOpen('crisis')){ rn.hidden = false; rn.textContent = `挑戰「${VIRUS_MODES.crisis.name}」`; rn.onclick = () => startVirus('crisis'); }
  else if (nowOpen){ rn.hidden = false; rn.textContent = `挑戰「${LEVELS[g.li+1].name}」`; rn.onclick = () => startGame(g.li+1); }
  else if (miniNew || (g.li===VIRUS_MODES.mini.open.level && modeOpen('mini'))){ rn.hidden = false; rn.textContent = `挑戰「${VIRUS_MODES.mini.name}」`; rn.onclick = () => startVirus('mini'); }
  else rn.hidden = true;
  if (newTitle) setTimeout(() => { if (screen==='result') showCert(); }, 900);
}
$('#rHome').addEventListener('click', () => show('home'));
function todayStr(){ const d = new Date(); return `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`; }

/* ---------- 鍵盤小勇士證書 ---------- */
function showCert(preview){
  $('#certWeek').textContent = `「${VERSION.name}」`;
  $('#certCrowns').innerHTML = LEVELS.map((lv,i) => `<div><i>👑</i>${lv.name}・${P.best[gk(i)]!=null ? P.best[gk(i)]+' 分' : '—'}</div>`).join('');
  $('#certDate').textContent = (P.title ? P.title.at : todayStr()) + (preview && !P.title ? '（預覽）' : '');
  $('#certSeat').value = '';
  $('#certVirus').hidden = !modeOpen('crisis');
  $('#certWrap').hidden = false;
  Sound.win();
  setTimeout(() => $('#certSeat').focus(), 300);
}
$('#certClose').addEventListener('click', () => { $('#certWrap').hidden = true; if (screen==='home') renderHome(); });
$('#certVirus').addEventListener('click', () => { $('#certWrap').hidden = true; startVirus('crisis'); });

  show('result');
  $('#rTitle').textContent = win ? `${v.M.name}：守護成功！` : v.M.name;
  $('#rTrend').className = 'trend ' + trend.cls; $('#rTrend').textContent = trend.text;
  $('#rStars').innerHTML = win ? '🏆' : '🦠';
  $('#rScore').innerHTML = `擊退 ${n}<small>/ ${VIRUS_GOAL} 隻</small>`;
  $('#rCrown').hidden = true;
  const avg = v.rts.length ? v.rts.reduce((a,b)=>a+b,0)/v.rts.length : 0;
  $('#rStats').innerHTML = [['擊退',`${n} 隻`],['打到',`第 ${stageOf(n)} 關`],['平均反應',avg?avg.toFixed(1)+' 秒':'—'],['最佳紀錄',`${P[bk]} 隻`]]
    .map(s => `<div>${s[0]}<b>${s[1]}</b></div>`).join('');
  const un = $('#rUnlock');
  const st = stageOf(n);
  un.hidden = false; un.className = win ? 'unlock-note' : 'unlock-note tip';
  un.textContent = win ? `你把 ${VIRUS_GOAL} 隻病毒全部擊退，電腦得救了！`
    : st < VIRUS_STAGES.length ? `再擊退 ${st*STAGE_EVERY - n} 隻，就能看到第 ${st+1} 關（${VIRUS_STAGES[st]}）・離終點還有 ${VIRUS_GOAL - n} 隻`
    : `最終防線！再擊退 ${VIRUS_GOAL - n} 隻就守護成功`;
  $('#rMissed').innerHTML = v.weak.size ? `<b>可以多練的鍵：</b>${[...v.weak].map(chipOf).join('')}` : '';
  $('#rWeak').hidden = true;
  const max = Math.max(1, ...hist.map(h => h.score)), best = Math.max(...hist.map(h => h.score)), last = hist.length-1;
  $('#rHist').innerHTML = `<b>這節課「${v.M.name}」的紀錄</b>
    <div class="hist-row hist-head"><span>時間</span><span></span><span>擊退</span><span></span></div>` +
    hist.map((h,i) => `<div class="hist-row ${i===last?'now':''} ${h.score===best?'best':''}"><span>${i===last?'這次':h.at}</span><span class="bar"><i style="width:${Math.round(h.score/max*100)}%"></i></span><span>${h.score===best?'🏅 ':''}${h.score} 隻</span><span></span></div>`).join('');
  $('#rAgain').onclick = () => startVirus(v.mode);
  const rn = $('#rNext');
  if (v.mode==='mini' && modeOpen('crisis')){ rn.hidden = false; rn.textContent = `挑戰「${VIRUS_MODES.crisis.name}」`; rn.onclick = () => startVirus('crisis'); }
  else rn.hidden = true;
}

/* ---------- 鍵盤與暫停 ---------- */
listenKeys(kb, code => {
  if (!$('#certWrap').hidden) return;
  if (screen==='warm') warmPress(code);
  else if (screen==='review') reviewPress(code);
  else if (screen==='game') gamePress(code);
  else if (screen==='virus') vPress(code);
});
setupFocus($('#focusPill'), {
  pausedText: () => ((screen==='game' && G) || (screen==='virus' && V)) ? '遊戲暫停中：點一下這裡繼續' : '點一下這裡，讓鍵盤連上遊戲',
  blur: () => { kb.upAll(); if (paused==null) paused = performance.now(); },
  focus: () => { if (paused!=null){ const d = performance.now()-paused; if (G){ G.deadline += d; G.start += d; } if (V){ V.deadline += d; V.start += d; } paused = null; } }
});

/* ---------- 學生連結（老師 2026-10-30）：網址後面加 #student＝發給學生的單頁練習，不顯示「回上頁／回目錄」
   連結在「鍵盤小勇士」選週次頁的「給學生的連結」產生；從網站目錄點進來時照舊有回上頁、回目錄 ---------- */
if (location.hash === '#student') document.getElementById('siteNav').hidden = true;
/* 熱身、救援隊、病毒挑戰進行中不小心按到關閉／重新整理：瀏覽器先問一次（這一局還沒結束；紀錄本身都存在這台電腦） */
window.addEventListener('beforeunload', e => { if (!DEMO && ['warm','game','virus'].includes(screen)){ e.preventDefault(); e.returnValue = ''; } });

show('home');
})();
