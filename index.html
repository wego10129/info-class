<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>資訊課練習遊戲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
:root{--paper:#E3EDF2;--grid:#D0DEE6;--ink:#1B2836;--soft:#4C5D6E;--card:#fff;--wash:#F3F7FA;--hl:#FFE066;
  --c1:#3A9FEF;--c2:#EE4F8B;--c3:#9466EE;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;color:var(--ink);font:16px/1.6 'Noto Sans TC','Microsoft JhengHei',sans-serif;padding:24px 16px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:20px}
h1,h2{font-family:'LXGW WenKai TC','Noto Sans TC',sans-serif;margin:0;line-height:1.25}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{font-size:32px;letter-spacing:.04em}
.tag{display:inline-block;background:var(--hl);border:3px solid var(--ink);border-radius:10px;padding:0 8px;box-shadow:3px 3px 0 var(--ink);font:600 20px 'Fredoka',sans-serif;transform:rotate(-4deg)}
.sub{color:var(--soft);font-weight:700;margin:0}
.unit{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:16px;display:grid;gap:12px}
.unit h2{font-size:26px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
a.game{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);border:3px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:3px 3px 0 var(--ink);background:var(--wash);transition:transform .08s}
a.game:hover{background:var(--hl);transform:translate(-1px,-1px)}
a.game:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
a.game:focus-visible{outline:3px solid var(--c1);outline-offset:3px}
.band{height:12px;border-bottom:3px solid var(--ink)}
.body{padding:10px 14px}
.week{font:600 14px 'Fredoka','Noto Sans TC',sans-serif;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 8px}
.name{display:block;font-weight:900;font-size:21px;margin-top:6px}
.keys{display:block;color:var(--soft);font-size:14px;font-weight:700}
.note{font-size:13px;color:var(--soft);font-weight:700;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="tag">Esc</span><h1>資訊課練習遊戲</h1></div>
    <p class="sub">點一下要練習的遊戲。紀錄只存在這台電腦，電腦重開機後就會清空。</p>
  </header>

  <section class="unit">
    <h2>⌨️ 鍵盤小勇士</h2>
    <div class="games">
      <a class="game" href="keyboard-w1.html"><span class="band" style="background:var(--c1)"></span>
        <span class="body"><span class="week">第 1 週</span><span class="name">左側鍵</span><span class="keys">Esc・Tab・Caps Lock・Shift・空白鍵</span></span></a>
      <a class="game" href="keyboard-w2.html"><span class="band" style="background:var(--c2)"></span>
        <span class="body"><span class="week">第 2 週</span><span class="name">右側鍵</span><span class="keys">Backspace・Delete・Enter・方向鍵</span></span></a>
      <a class="game" href="keyboard-w3.html"><span class="band" style="background:var(--c3)"></span>
        <span class="body"><span class="week">第 3 週</span><span class="name">混合練習</span><span class="keys">左側鍵＋右側鍵全部一起</span></span></a>
    </div>
  </section>

  <section class="unit">
    <h2>🥷 打字忍者</h2>
    <div class="games">
      <a class="game" href="typing-ninja.html"><span class="band" style="background:#3B2F5C"></span>
        <span class="body"><span class="week">字母打字</span><span class="name">打字忍者</span><span class="keys">中排・上排・下排｜單一字母 → 字母組合 → 忍者大戰</span></span></a>
    </div>
    <p class="note">老師指定字母、改頒獎時間：<a href="typing-setup.html">打字忍者・老師設定</a></p>
  </section>

  <p class="note">老師示範：在遊戲網址後面加上 #demo（全部打開、不存紀錄）。本網站不放任何學生資料。</p>
</div>
</body>
</html>
