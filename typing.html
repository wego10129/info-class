<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中英文打字修練</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<link rel="stylesheet" href="site.css">
</head>
<body>
<div class="wrap">
  <header>
    <p class="crumb"><a href="index.html">資訊課練習遊戲</a> ／ 中英文打字修練</p>
    <div class="brand"><span class="tag">ㄅA</span><h1>中英文打字修練</h1></div>
    <p class="sub">選擇中文或英文，進入「教師設定」設定練習內容，再把連結或捷徑檔發給學生。</p>
  </header>

  <div class="tiles">
    <a class="tile" href="typing-setup.html"><span class="band" style="background:var(--c4)"></span>
      <span class="body">
        <h2>🔤 英文打字</h2>
        <ul>
          <li>字母：中排、上排、下排，或老師自選字母</li>
          <li>第一關單一字母 → 第二關字母組合 → 第三關打字忍者</li>
          <li>學生要自己切換成英文輸入法</li>
        </ul>
        <span class="go">進入教師設定 →</span>
      </span></a>

    <div class="tile off" aria-disabled="true"><span class="band" style="background:var(--c5)"></span>
      <span class="body">
        <h2>🀄 中文打字</h2>
        <ul>
          <li>老師出題：語詞、句子、標點符號</li>
          <li>選完字按 Enter 送出</li>
          <li>由「Word 打字大挑戰」改版</li>
        </ul>
        <span class="go">準備中</span>
      </span></div>
  </div>

  <p class="note">不需要指定字母時，學生可以直接打開 <a href="typing-ninja.html">英文打字（自選中排、上排、下排）</a>。</p>

  <nav class="footnav"><a class="btn" href="index.html">⬅ 回目錄</a></nav>
</div>
</body>
</html>
